function ovPickEx(o) {
  const q = ui.exSearch.trim().toLowerCase();
  let list = S.lib.slice();
  if (q) list = list.filter(e => (e.name + ' ' + e.cat + ' ' + e.sub + ' ' + e.variant).toLowerCase().indexOf(q) >= 0);
  let inner = '<button class="row" data-act="customEx"><div class="chev" style="color:var(--text)">' + I.plus + '</div>' +
    '<div class="grow"><div class="nm">Vlastný cvik' + (q ? ': „' + esc(ui.exSearch.trim()) + '“' : '') + '</div>' +
    '<div class="mt">Pridať cvik, ktorý v zozname nie je</div></div></button>';
  if (o.custom) {
    inner = '<div class="card" style="margin-bottom:12px">' +
      '<div class="field"><label>Názov cviku</label><input class="inp" id="f-exname" value="' + esc(ui.exSearch.trim()) + '" autocapitalize="sentences"></div>' +
      '<div class="field"><label>Kategória</label><select class="inp" id="f-excat">' + CATS.map(p => '<option>' + esc(p) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Variant</label><select class="inp" id="f-exvar">' + VARIANTS.map(p => '<option>' + esc(p) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Poznámka k cviku</label><input class="inp" id="f-exnote" placeholder="technika, náradie, obmedzenia…"></div>' +
      '<button class="btn primary sm" data-act="saveCustomEx">Pridať a použiť</button></div>';
  }
  /* zoskupenie do podskupín; `short` vynechá kategóriu z názvu skupiny,
     keď je kategória už napísaná nad blokom */
  function renderGroups(items, short) {
    const groups = {}, order = [];
    items.forEach(e => {
      const g = exGroup(e);
      if (order.indexOf(g) < 0) order.push(g);
      (groups[g] = groups[g] || []).push(e);
    });
    return order.map(part => {
      const e0 = groups[part][0];
      // short: 1 = bez kategórie, 2 = len variant (kategória aj podskupina sú nad blokom)
      const lbl = short === 2 ? (e0.variant || '')
        : (short ? [e0.sub, e0.variant].filter(Boolean).join(' · ') : part);
      return (lbl ? '<div class="label" style="margin:16px 0 8px">' + esc(lbl) + '</div>' : '<div style="height:10px"></div>') +
        '<div class="list">' +
        groups[part].map(e => '<button class="row" data-act="addEx" data-id="' + e.id + '">' +
          '<div class="grow"><div class="nm">' + esc(e.name) + '</div>' + (e.note ? '<div class="mt">' + esc(e.note) + '</div>' : '') + '</div>' +
          '<div class="chev">' + I.plus + '</div></button>').join('') + '</div>';
    }).join('');
  }
  /* 0.1.4 fix — pri výmene cviku sa najprv ponúkne blízka skupina, zvyšok
     databázy je zbalený za šípkou.
     0.1.5 — zúžené z kategórie na podskupinu (napr. Kolenný ohyb — quadriceps);
     cviky bez podskupiny (plyometria, olympijské) sa zúžia aspoň na kategóriu. */
  let focus = null;
  if (o.replaceIdx != null && !q) {
    const pp = plan(o.pid);
    const dd = pp && pp.days.find(x => x.id === o.did);
    const itc = dd && dd.items[o.replaceIdx];
    const exc = itc && exOf(itc.exId);
    if (exc) focus = { cat: exc.cat, sub: exc.sub || '' };
  }
  let body;
  if (focus) {
    const inFocus = e => e.cat === focus.cat && (focus.sub ? e.sub === focus.sub : !e.sub);
    const same = list.filter(inFocus);
    const rest = list.filter(e => !inFocus(e));
    body = '<div class="dbcat" style="padding:0;margin:14px 0 0">' + esc(focus.sub || focus.cat) + '</div>' +
      (focus.sub ? '<div class="hint" style="margin-top:2px">' + esc(focus.cat) + '</div>' : '') +
      (same.length ? renderGroups(same, 2)
        : '<div class="hint" style="padding:12px 0">V tejto podskupine nie je iný cvik.</div>') +
      '<div style="height:18px"></div>' +
      '<button class="row" data-act="pickExAll" style="background:var(--surface);border-radius:var(--r)">' +
      '<div class="grow"><div class="nm" style="font-weight:600">' +
      (o.showAll ? 'Skryť zvyšok databázy' : 'Zvyšok databázy') + '</div>' +
      '<div class="mt">' + esc(nf(rest.length) + ' ' + plural(rest.length, 'cvik', 'cviky', 'cvikov')) + '</div></div>' +
      '<div class="chev expand' + (o.showAll ? ' on' : '') + '">' + I.cdown + '</div></button>' +
      (o.showAll ? renderGroups(rest, false) : '');
  } else {
    body = renderGroups(list, false);
  }
  if (!list.length) body = '<div class="hint" style="text-align:center;padding:20px 0">Nič sa nenašlo. Pridaj vlastný cvik.</div>';
  const search = '<div class="searchwrap" style="margin:0 0 4px">' + I.search +
    '<input class="inp" type="search" placeholder="Hľadať cvik" data-in="exSearch" value="' + esc(ui.exSearch) + '" autocomplete="off" autocorrect="off" spellcheck="false"></div>';
  const ttl = o.replaceIdx != null ? 'Vymeniť cvik' : (o.ss ? 'Cvik do supersérie' : 'Pridať cvik');
  return sheet(ttl, search + inner + '<div id="exResults">' + body + '</div>', { key: 'pickex' });
}

/* ============================================================
   3. Zápis tréningu
   ============================================================ */
function lastNumbersFor(cid, exId) {
  const ss = doneSessions(cid);
  for (let i = 0; i < ss.length; i++) {
    const e = (ss[i].exs || []).find(x => x.exId === exId);
    if (e) {
      // 0.1.4 — pri „Naposledy“ je počet sérií a k nemu najlepší výkon
      return { txt: 'Naposledy: ' + pSeria(e.sets) + ' · najlepší výkon ' + perfText(e.reps, e.w),
        w: e.w, r: e.reps, sets: e.sets, date: ss[i].date };
    }
  }
  return null;
}
/* Zápis sa robí na úrovni cviku: série × opakovania × váha + poznámka.
   Bez časovača — tréning sa dá zapísať aj dodatočne, dátum je voliteľný. */
function makeDraft(cid, forcedDayId, dateStr, sess) {
  const c = client(cid);
  const p = plan(c.planId);
  let day = null;
  if (p && p.days.length) {
    if (forcedDayId) day = p.days.find(d => d.id === forcedDayId) || null;
    if (!day) {
      const ls = lastSession(cid);
      const li = ls ? p.days.findIndex(d => d.id === ls.dayId) : -1;
      day = p.days[(li + 1) % p.days.length];
    }
  }
  /* 0.1.4 — ak sa zapisuje z náhľadu termínu, cviky sa berú z neho
     (vrátane jednorazovo vymenených), nie priamo z dňa plánu */
  const pi = sess ? plannedItems(sess) : null;
  // ak si termín nesie vlastný zoznam (výmena/odstránenie), platí presne on
  const src = (sess && sess.exsPlan) ? sess.exsPlan : ((pi && pi.length) ? pi : (day ? day.items : []));
  const exs = src.map(it => {
    const ex = exOf(it.exId);
    const last = lastNumbersFor(cid, it.exId);
    const w = it.weight != null ? it.weight : (last ? last.w : (ex && ex.base ? roundTo(ex.base * 0.5, qFor(ex)) : 0));
    return { exId: it.exId, name: ex ? ex.name : 'Cvik', ss: it.ss || null,
      sets: last ? last.sets : it.sets, reps: repsNum(it), w: w, note: '', rows: null, open: false,
      // rozcvičovacie série sa preberú z plánu a dajú sa v zápise doplniť či zmazať
      warm: warmCopy(it.warm) };
  });
  return {
    clientId: cid, date: dateStr || ymd(today()), planId: p ? p.id : null,
    dayId: day ? day.id : null, dayName: day ? day.name : 'Voľný tréning',
    exs: exs, note: ''
  };
}
/* zmena počtu sérií a najlepšieho výkonu v zbalenom cviku */
function setExSets(e, n) {
  n = Math.max(0, Math.round(n) || 0);
  if (!e.rows) { e.sets = n; return; }
  while (e.rows.length > n) e.rows.pop();
  while (e.rows.length < n) {
    const l = e.rows[e.rows.length - 1] || { r: Number(e.reps) || 0, w: Number(e.w) || 0 };
    e.rows.push({ r: l.r, w: l.w });
  }
}
function setExBest(e, f, v) {
  if (e.rows) { e.rows.forEach(r => { if (f === 'w') r.w = v; else r.r = v; }); return; }
  if (f === 'w') e.w = v; else e.reps = v;
}

function ovClientView(o) {
  const c = client(o.id);
  if (!c) return '';
  const ss = doneSessions(c.id);
  const p = plan(c.planId);
  const ws = startOfWeek(today()), we = ymd(addDays(ws, 6));
  const thisWeek = ss.filter(s => s.date >= ymd(ws) && s.date <= we);

  let h = '<div class="ov"><div class="fs cv"><div class="body pb-safe" data-scroll="cv">';
  h += '<div class="hero"><div class="hi">Tvoj tréningový prehľad</div><h2>' + esc(c.name.split(' ')[0]) + '</h2></div>';

  // 0.1.3 — zostatok predplatených tréningov namiesto série v rade, ak je predplatené
  if (isPrepaid(c)) {
    h += '<div class="sec" style="text-align:center"><div class="big">' + esc(nf(leftOf(c))) + '</div>' +
      '<div class="lbl" style="margin-top:2px">' +
      esc(plural(leftOf(c), 'tréning zostáva', 'tréningy zostávajú', 'tréningov zostáva')) +
      '</div><div class="hint" style="text-align:center;margin-top:6px">z balíka ' + esc(nf(c.prepaid)) + '</div></div>';
  } else {
    h += '<div class="sec" style="text-align:center"><div class="big">' + esc(nf(streakWeeks(c.id))) + '</div>' +
      '<div class="lbl" style="margin-top:2px">' + esc(plural(streakWeeks(c.id), 'týždeň v rade', 'týždne v rade', 'týždňov v rade')) + '</div></div>';
  }

  /* 0.1.5 — pohľad klienta je rozdelený na tri záložky */
  const CVT = [{ id: 'terminy', t: 'Termíny' }, { id: 'pokrok', t: 'Pokrok' }, { id: 'nastavenia', t: 'Nastavenia' }];
  if (!CVT.some(x => x.id === ui.cvTab)) ui.cvTab = 'terminy';
  h += '<div class="sec"><div class="pad"><div class="seg">' +
    CVT.map(x => '<button data-act="cvTab" data-id="' + x.id + '" class="' + (ui.cvTab === x.id ? 'on' : '') + '">' +
      esc(x.t) + '</button>').join('') + '</div></div></div>';

  if (ui.cvTab === 'pokrok') {
    h += ctabPokrok(c, ss);
    h += weightBlock(c);
    h += '<div style="height:28px"></div></div></div></div>';
    return h;
  }
  if (ui.cvTab === 'nastavenia') {
    h += '<div class="sec">' + secH('O tréningu') + '<div class="pad"><div class="list">' +
      infoRow('Tréner', S.coach.name) +
      (p ? infoRow('Plán', p.name) : '') +
      infoRow('Platba', payLine(c)) +
      (isPrepaid(c) ? infoRow('Zostáva', leftLabel(c) + ' tréningov') : '') +
      '</div></div></div>';
    h += '<div class="sec" style="margin-top:28px"><div class="pad">' +
      '<button class="btn quiet" data-act="closeOv">Ukončiť ukážku pohľadu klienta</button></div></div>';
    h += '<div style="height:28px"></div></div></div></div>';
    return h;
  }

  /* 0.1.4 — tento týždeň sa ukazuje deň v týždni a čas tréningu,
     nie názov dňa z plánu (Deň A) */
  const wsY = ymd(ws);
  const weekAll = S.sessions.filter(s => s.clientId === c.id && s.date >= wsY && s.date <= we)
    .sort((a, b) => (a.date + (a.time || '')) < (b.date + (b.time || '')) ? -1 : 1);
  h += '<div class="sec"><div class="lbl">Tento týždeň</div><div class="pad" style="margin-top:10px">';
  if (weekAll.length) {
    h += '<div class="card" style="padding:4px 0">' + weekAll.map(s => {
      const on = s.status === 'done';
      return '<div class="dayrow"><div class="mark ' + (on ? 'on' : '') + '">' + (on ? I.check : '') + '</div>' +
        '<div class="grow"><div style="font-weight:600;font-size:17px">' +
        esc(DOWL[parseD(s.date).getDay()]) + (s.time ? ' · ' + esc(s.time) : '') + '</div>' +
        '<div class="hint">' + esc(fmtD(s.date)) + (on ? ' · odtrénované' : '') + '</div></div></div>';
    }).join('') + '</div>';
  } else if (p && p.days.length) {
    h += '<div class="card hint" style="text-align:center;padding:22px">Tento týždeň nemáš naplánovaný tréning.</div>';
  } else {
    h += '<div class="card hint" style="text-align:center;padding:22px">Tréner ti zatiaľ nepriradil plán.</div>';
  }
  h += '<div class="hint" style="text-align:center;margin-top:12px">' + esc(nf(thisWeek.length)) + ' z ' + esc(nf(p ? p.dpw : 0)) + ' tréningov splnených</div>';
  h += '</div></div>';

  // 0.1.4 — naplánované termíny na ďalšie obdobie
  h += cvUpcoming(c);

  // 0.1.3 — voľné termíny a žiadosť o rezerváciu (kozmetické)
  h += cvBooking(c);

  h += '<div style="height:28px"></div></div></div></div>';
  return h;
}
/* 0.1.4 — naplánované termíny klienta. Fixný klient vidí budúci týždeň,
   operatívny všetky nadchádzajúce, ktoré má zapísané. */
function cvUpcoming(c) {
  const t0 = ymd(today());
  const op = c.typ === 'operativny';
  const nws = ymd(addDays(startOfWeek(today()), 7));
  const nwe = ymd(addDays(startOfWeek(today()), 13));
  const list = S.sessions.filter(s => s.clientId === c.id && s.status === 'planned' &&
    (op ? s.date >= t0 : (s.date >= nws && s.date <= nwe)))
    .sort((a, b) => (a.date + (a.time || '')) < (b.date + (b.time || '')) ? -1 : 1);
  let h = '<div class="sec"><div class="lbl">' + (op ? 'Nadchádzajúce termíny' : 'Budúci týždeň') +
    '</div><div class="pad" style="margin-top:10px">';
  if (!list.length) {
    h += '<div class="card hint" style="text-align:center;padding:22px">' +
      (op ? 'Zatiaľ nemáš zapísaný žiadny termín.' : 'Budúci týždeň zatiaľ nemáš termín.') + '</div>';
  } else {
    h += '<div class="card" style="padding:4px 0">' + list.map(s =>
      '<div class="dayrow"><div class="mark"></div>' +
      '<div class="grow"><div style="font-weight:600;font-size:17px">' +
      esc(DOWL[parseD(s.date).getDay()]) + (s.time ? ' · ' + esc(s.time) : '') + '</div>' +
      '<div class="hint">' + esc(fmtD(s.date)) + '</div></div></div>').join('') + '</div>';
  }
  /* 0.1.5 — fixný klient si termín nepýta, ale nahrádza: tlačidlo je tu,
     v prehľade budúceho týždňa, a rozbalí voľné hodiny trénera */
  if (!op && !ui.cvAsk) {
    h += '<div style="height:12px"></div>' +
      '<button class="btn quiet" data-act="cvAsk">' + I.cal + 'Nahradiť termín</button>';
  }
  return h + '</div></div>';
}
/* Voľné termíny: 14 dní dopredu, len hodiny, ktoré nie sú obsadené.
   Klient nevidí ostatných klientov ani obsadené časy — iba voľno. */
function cvBooking(c) {
  const t0 = today();
  const days = [];
  for (let i = 1; i <= 14; i++) {
    const d = addDays(t0, i);
    const ds = ymd(d);
    const free = freeSlots(ds);
    if (free.length) days.push({ ds: ds, d: d, free: free });
  }
  /* 0.1.5 — bez nadpisu „Voľné termíny“ a bez textu pod tlačidlom;
     fixnému klientovi sa hodiny ukážu až po ťuknutí na Nahradiť termín
     (tlačidlo je v prehľade budúceho týždňa), operatívny ich má stále. */
  if (c.typ === 'fixny' && !ui.cvAsk) return '';
  let h = '<div class="sec"><div class="pad" style="margin-top:10px">';
  if (!days.length) {
    h += '<div class="card hint" style="text-align:center;padding:22px">Momentálne nie sú voľné termíny.</div></div></div>';
    return h;
  }
  const sel = days.find(x => x.ds === ui.cvDay) || days[0];
  // pás dní
  h += '<div class="cvdays">' + days.map(x =>
    '<button class="cvday' + (x.ds === sel.ds ? ' on' : '') + '" data-act="cvBookDay" data-id="' + x.ds + '">' +
    '<span class="cvdow">' + esc(DOWSHORT[(x.d.getDay() + 6) % 7]) + '</span>' +
    '<span class="cvnum">' + x.d.getDate() + '</span>' +
    '<span class="cvfree">' + esc(nf(x.free.length)) + '</span></button>').join('') + '</div>';
  // voľné hodiny vybraného dňa
  h += '<div class="hint" style="margin:12px 0 8px">' + esc(fmtDW(sel.ds)) + '</div>' +
    '<div class="cvslots">' + sel.free.map(t =>
      '<button class="cvslot" data-act="cvRequest" data-date="' + sel.ds + '" data-time="' + t + '">' + esc(t) + '</button>').join('') +
    '</div>' +
    '<div class="hint" style="margin-top:10px">Ťuknutím pošleš trénerovi žiadosť o termín.</div>';
  return h + '</div></div>';
}

function ovDayPick(o) {
  const d = ui.draft; if (!d) return '';
  const p = plan(d.planId); if (!p) return '';
  const b = '<div class="list" style="background:transparent">' + p.days.map(day =>
    '<button class="row" data-act="useDay" data-id="' + day.id + '"><div class="grow">' +
    '<div class="nm">' + esc(day.name) + '</div><div class="mt">' + esc(pCvik(day.items.length)) + '</div></div>' +
    (d.dayId === day.id ? '<div class="chev" style="color:var(--text)">' + I.check + '</div>' : '<div class="chev">' + I.chev + '</div>') +
    '</button>').join('') + '</div>' +
    '<div class="hint" style="margin-top:12px">Zmena dňa prepíše zapísané série.</div>';
  return sheet('Tréningový deň', b, { key: 'daypick' });
}

/* ============================================================
   Supersérie — skupiny cvikov v rámci dňa plánu
   ============================================================ */
function ssGroups(p, d) { return (d && d.ssg) || []; }
function ssName(planId, dayId, ssId) {
  const p = plan(planId); if (!p) return null;
  const d = p.days.find(x => x.id === dayId); if (!d) return null;
  const g = ssGroups(p, d).find(x => x.id === ssId);
  return g ? g.name : null;
}

/* ============================================================
   Rozcvička — sprievodca fázami (0.1.5)
   ============================================================ */
function wuFresh() { return { phase: 0, sel: {}, skipWarm: false, myo: null, skipped: {} }; }
function wuKey(pid, kind, name) { return pid + '|' + kind + '|' + name; }
function wuOn(pid, kind, name) { return !!ui.wu.sel[wuKey(pid, kind, name)]; }
function wuPicked(pid, kind) {
  const pre = pid + '|' + kind + '|';
  return Object.keys(ui.wu.sel).filter(k => ui.wu.sel[k] && k.indexOf(pre) === 0).map(k => k.slice(pre.length));
}
function wuRow(pid, kind, name) {
  const on = wuOn(pid, kind, name);
  return '<button class="row" data-act="wuPick" data-pid="' + pid + '" data-kind="' + kind + '" data-nm="' + esc(name) + '">' +
    '<div class="pick' + (on ? ' on' : '') + '">' + (on ? I.check : '') + '</div>' +
    '<div class="grow"><div class="nm" style="font-weight:500">' + esc(name) + '</div></div></button>';
}
function wuList(pid, kind, items) {
  return '<div class="pad"><div class="list">' + items.map(n => wuRow(pid, kind, n)).join('') + '</div></div>';
}
function wuDots(i, n) {
  let h = '<div style="display:flex;gap:5px;justify-content:center;margin:14px 0 4px">';
  for (let k = 0; k < n; k++) {
    h += '<span style="width:' + (k === i ? '20px' : '6px') + ';height:6px;border-radius:3px;background:' +
      (k === i ? 'var(--text)' : (k < i ? '#4a4a52' : 'var(--line)')) + '"></span>';
  }
  return h + '</div>';
}
function scWarmup() {
  const w = ui.wu, total = WU_PHASES.length;
  if (w.phase >= total) return wuSummary();
  const ph = WU_PHASES[w.phase];
  let h = navbar('Rozcvička', { backAct: 'wuBack',
    right: '<div class="iconbtn ghost" style="pointer-events:none">' + esc(nf(w.phase + 1) + '/' + nf(total)) + '</div>' });
  h += '<div class="body pb-act" data-scroll="wu-' + ph.id + '">';
  h += wuDots(w.phase, total);
  h += '<div class="pad" style="margin-top:8px">' +
    '<div style="font-size:23px;font-weight:700;letter-spacing:-.02em">' + esc(ph.name) + '</div>' +
    (ph.optional ? '<div class="hint" style="margin-top:2px">Nepovinná fáza — dá sa preskočiť.</div>' : '') +
    '</div>';

  if (ph.id === 'zahriatie') {
    // voľba na úrovni fázy — nie je to cvik, uspokojí celú fázu
    h += '<div class="sec" style="margin-top:16px"><div class="pad"><div class="list">' +
      '<button class="row" data-act="wuSkipWarm">' +
      '<div class="pick' + (w.skipWarm ? ' on' : '') + '">' + (w.skipWarm ? I.check : '') + '</div>' +
      '<div class="grow"><div class="nm" style="font-weight:500">' + esc(ph.optOut) + '</div></div></button>' +
      '</div></div></div>';
    if (!w.skipWarm) h += wuGroups(ph);
  } else if (ph.id === 'myo') {
    h += '<div class="sec" style="margin-top:16px"><div class="pad"><div class="seg">' +
      '<button data-act="wuMyo" data-id="ano" class="' + (w.myo === 'ano' ? 'on' : '') + '">Áno</button>' +
      '<button data-act="wuMyo" data-id="nie" class="' + (w.myo === 'nie' ? 'on' : '') + '">Nie</button>' +
      '</div></div></div>';
    if (w.myo === 'ano') {
      h += '<div class="sec">' + secH('Pomôcka') + wuList(ph.id, 'tool', ph.tools);
      h += '</div>';
      // oblasti sa ukážu až po výbere aspoň jednej pomôcky
      if (wuPicked(ph.id, 'tool').length) {
        h += '<div class="sec">' + secH('Oblasť') + wuList(ph.id, 'area', ph.areas) + '</div>';
      }
    } else if (w.myo === 'nie') {
      h += '<div class="pad" style="margin-top:16px"><div class="card hint" style="text-align:center;padding:22px">' +
        'Fáza sa preskočí.</div></div>';
    }
  } else {
    h += wuGroups(ph);
  }

  h += '<div style="height:20px"></div></div>';
  const lastPh = w.phase === total - 1;
  h += '<div class="actionbar">' +
    (ph.optional ? '<button class="btn quiet" data-act="wuSkip" style="margin-bottom:10px">Preskočiť fázu</button>' : '') +
    '<button class="btn primary" data-act="wuNext">' + (lastPh ? 'Dokončiť rozcvičku' : 'Ďalej') + '</button>' +
    '</div>';
  return h;
}
function wuGroups(ph) {
  return (ph.groups || []).map(g =>
    '<div class="sec">' + (g.name ? secH(g.name) : '') + wuList(ph.id, 'ex', g.items) + '</div>').join('');
}
/* zhrnutie na konci — čo je vybrané v jednotlivých fázach */
function wuSummary() {
  const w = ui.wu;
  let h = navbar('Rozcvička', { backAct: 'wuBack' });
  h += '<div class="body pb-act" data-scroll="wu-sum">';
  h += '<div class="pad" style="padding-top:18px">' +
    '<div style="font-size:23px;font-weight:700;letter-spacing:-.02em">Rozcvička je hotová</div>' +
    '<div class="hint" style="margin-top:4px">Prehľad toho, čo si vybral. Ide sa do hlavného bloku.</div></div>';
  WU_PHASES.forEach(ph => {
    let val;
    if (ph.id === 'zahriatie' && w.skipWarm) val = ['Klient sa už zahrial cestou na tréning'];
    else if (ph.id === 'myo' && w.myo === 'nie') val = null;
    else if (ph.id === 'myo') {
      const t = wuPicked(ph.id, 'tool'), a = wuPicked(ph.id, 'area');
      val = t.length ? [t.join(', ') + (a.length ? ' · ' + a.join(', ') : '')] : null;
    } else val = wuPicked(ph.id, 'ex');
    if (w.skipped[ph.id]) val = null;
    h += '<div class="sec">' + secH(ph.name) + '<div class="pad">' +
      (val && val.length
        ? '<div class="card" style="font-size:15px;line-height:1.6">' + esc(val.join(' · ')) + '</div>'
        : '<div class="card hint" style="padding:14px">Preskočené</div>') +
      '</div></div>';
  });
  h += '<div style="height:20px"></div></div>';
  h += '<div class="actionbar">' +
    '<button class="btn quiet" data-act="wuRestart" style="margin-bottom:10px">Začať odznova</button>' +
    '<button class="btn primary" data-act="back">Zavrieť</button></div>';
  return h;
}

/* ============================================================
   Databáza cvikov — prehliadanie, poznámky, vlastné cviky
   ============================================================ */
function dbListHTML() {
  const q = (ui.dbSearch || '').trim().toLowerCase();
  let list = S.lib.slice();
  if (q) list = list.filter(e => (e.name + ' ' + e.cat + ' ' + e.sub + ' ' + e.variant).toLowerCase().indexOf(q) >= 0);
  if (!list.length) return '<div class="pad"><div class="hint" style="text-align:center;padding:24px 0">Nič sa nenašlo.</div></div>';
  /* 0.1.4 — názov kategórie je nad blokom raz; podskupina a variant sa opakujú pod ním */
  const groups = {}, order = [];
  list.forEach(e => {
    const g = exGroup(e);
    if (order.indexOf(g) < 0) order.push(g);
    (groups[g] = groups[g] || []).push(e);
  });
  /* skupiny rovnakej kategórie musia ísť za sebou, inak by vlastný cvik
     pridaný na koniec zásobníka zopakoval hlavičku kategórie dole */
  const catIdx = c => { const i = CATS.indexOf(c); return i < 0 ? CATS.length : i; };
  order.sort((a, b) => catIdx(groups[a][0].cat) - catIdx(groups[b][0].cat));
  let h = '', lastCat = null;
  order.forEach(g => {
    const e0 = groups[g][0];
    if (e0.cat !== lastCat) {
      lastCat = e0.cat;
      h += '<div class="dbcat">' + esc(e0.cat) + '</div>';
    }
    const sub = [e0.sub, e0.variant].filter(Boolean).join(' · ');
    h += (sub ? '<div class="dbsub">' + esc(sub) + '</div>' : '<div style="height:10px"></div>') +
      '<div class="pad"><div class="list">' + groups[g].map(e =>
        '<div class="row tap" role="button" tabindex="0" data-act="exNote" data-id="' + e.id + '">' +
        '<div class="grow"><div class="nm">' + esc(e.name) + (e.custom ? ' <span class="hint">· vlastný</span>' : '') + '</div>' +
        (e.note ? '<div class="mt">' + esc(e.note) + '</div>' : '') + '</div>' +
        (e.custom ? '<button class="iconbtn muted" data-act="delDbEx" data-id="' + e.id + '" aria-label="Odstrániť">' + I.trash + '</button>' : '') +
        '<div class="chev">' + I.chev + '</div></div>').join('') + '</div></div>';
  });
  return h;
}
function scExdb() {
  let h = navbar('Databáza cvikov', {
    right: '<button class="iconbtn" data-act="newDbEx" aria-label="Nový cvik">' + I.plus + '</button>'
  });
  h += '<div class="hdr plain" style="padding-top:0">' +

}

/* ============================================================
   Prekrytia pridané v 0.1.2

function ovCalMenu() {

    '<button class="row" data-act="overview"><div class="grow">' +
    '<div class="nm">Prehľad</div><div class="mt">Zhrnutie odvedenej práce po mesiacoch</div></div>' +

    '<button class="row" data-act="workMode"><div class="grow">' +

    '<div class="chev">' + I.chev + '</div></button>' +
    '<button class="row" data-act="workHrs"><div class="grow">' +
    '<div class="nm">Pracovné hodiny</div>' +
    '<div class="mt">Od ' + esc(nf(S.coach.workFrom)) + ':00 do ' + esc(nf(S.coach.workTo)) + ':00' +
    (breakLabel() ? ' · pauza ' + esc(breakLabel()) : '') + ' — z toho sa počítajú voľné termíny</div></div>' +
    '<div class="chev">' + I.chev + '</div></button>' +
    '</div>';
  return sheet('Možnosti kalendára', b, { key: 'calmenu' });
}
function monthStats(off) {
  const base = new Date(today().getFullYear(), today().getMonth() + off, 1);
  const inM = s => {
    const d = parseD(s.date);
    return d.getFullYear() === base.getFullYear() && d.getMonth() === base.getMonth();
  };
  const all = S.sessions.filter(inM);
  const done = all.filter(s => s.status === 'done');
  let vol = 0; done.forEach(s => vol += sessVolume(s));
  const cl = {}; done.forEach(s => cl[s.clientId] = 1);
  return { label: MONL[base.getMonth()] + ' ' + base.getFullYear(), total: all.length,
    done: done.length, vol: Math.round(vol), clients: Object.keys(cl).length };
}
function ovOverview() {
  const rows = [0, -1, -2, -3, -4, -5].map(monthStats);
  /* 0.1.4 — počet tréningov po mesiacoch ako graf (rovnaký ako v Pokroku); objem je preč */
  const pts = [-5, -4, -3, -2, -1, 0].map(off => {
    const r = monthStats(off);
    const base = new Date(today().getFullYear(), today().getMonth() + off, 1);
    return { d: ymd(base), v: r.done, lbl: MON[base.getMonth()] + ' · ' + pTrening(r.done) };
  });
  const mfmt = s => { const d = parseD(s); return MON[d.getMonth()]; };
  const b = '<div class="hint" style="margin-bottom:14px">Koľko práce si odviedol — aktuálny mesiac a päť predošlých.</div>' +
    '<div class="chartcard" style="margin-bottom:14px">' + chartSVG(pts, 'tréningov', { fmt: mfmt }) + '</div>' +
    '<div class="list">' + rows.map((r, i) => '<div class="row"><div class="grow">' +
      '<div class="nm">' + esc(r.label) + (i === 0 ? ' <span class="hint">· teraz</span>' : '') + '</div>' +
      '<div class="mt">' + esc(pTrening(r.done)) + ' · ' + esc(pKlient(r.clients)) + '</div></div>' +
      '</div>').join('') + '</div>';
  return sheet('Prehľad', b, { key: 'overview' });
}
function ovWorkMode() {
  const list = offSorted();
  let b = '<div class="label" style="margin-bottom:8px">Pracovné voľno</div>';
  b += '<div class="list">' +
    (list.length ? list.map(o => '<div class="row"><div class="grow">' +
      '<div class="nm">' + esc(fmtD(o.from)) + (o.to !== o.from ? ' – ' + esc(fmtD(o.to)) : '') + '</div>' +
      (o.note ? '<div class="mt">' + esc(o.note) + '</div>' : '') + '</div>' +
      '<button class="iconbtn muted" data-act="delOff" data-id="' + o.id + '" aria-label="Zmazať">' + I.trash + '</button>' +

function readItemForm(it) {

  const rg = $('#f-itrange'); if (rg) it.range = rg.value.trim() ? rg.value.trim() : null;
  const sel = $('#f-itss'); if (sel) it.ss = sel.value || null;
  (it.warm || []).forEach((w, wi) => {
    const r = $('.wm-r[data-wi="' + wi + '"]'), q = $('.wm-w[data-wi="' + wi + '"]');
    if (r) w.r = r.value.trim() === '' ? null : Math.max(0, Math.round(num(r.value)));
    if (q) w.w = q.value.trim() === '' ? null : Math.max(0, num(q.value));
  });

  acTyp: (t) => { const o = acStash(); if (o) { o.typ = t.dataset.id; if (o.typ !== 'fixny') o.dni = []; render(); } },

  },
  saveClient: () => {
    const o = acStash() || {};
    const nm = ($('#f-name').value || '').trim();
    if (!nm) { $('#f-name').focus(); toast('Zadaj meno klienta'); return; }
    if (o.typ === 'fixny' && !o.dni.length) { toast('Vyber aspoň jeden deň v týždni'); return; }
    const c = {
      id: uid('c'), name: nm, age: null, planId: null,
      typ: o.typ || 'fixny', strava: !!o.strava,
      platba: o.platba || 'jednorazovo',
      prepaid: o.platba === 'predplatne' ? (o.prepaid || 10) : 0,
      left: o.platba === 'predplatne' ? (o.prepaid || 10) : 0, holiday: false,

      since: ymd(today()), flag: null, time: o.time || '17:00', weights: [], files: []
    };
    S.clients.push(c);
    // fixný klient → termíny do kalendára na 2 týždne dopredu
    let hits = 0;
    if (c.typ === 'fixny' && c.dni.length) {
      const ws = startOfWeek(today());
      for (let i = 0; i < 14; i++) {
        const d = addDays(ws, i);
        if (c.dni.indexOf((d.getDay() + 6) % 7) < 0) continue;
        if (diffDays(today(), d) <= 0) continue;
        const ns = {
          id: uid('s'), clientId: c.id, date: ymd(d), time: c.time,

        };

  itStep: (t) => {

  },
  saveItem: (t) => {
    const p = plan(t.dataset.pid); const d = p && p.days.find(x => x.id === t.dataset.did);
    const it = d && d.items[Number(t.dataset.idx)]; if (!it) return;
    readItemForm(it);
    save(); closeOv();
    /* 0.1.4 fix — nová superséria potrebuje dva cviky; po prvom sa výber
       cvikov otvorí znova a až druhý vráti používateľa do plánu */
    const f = ui.ssFill;
    if (f && it.ss === f.ss && d.items.filter(x => x.ss === f.ss).length < 2) {
      ui.exSearch = '';
      openOv({ t: 'pickEx', pid: f.pid, did: f.did, ss: f.ss });
      toast('Do supersérie pridaj ešte jeden cvik');
    } else {
      ui.ssFill = null;
    }
  },
  delItem: (t) => {
    const p = plan(t.dataset.pid); const d = p && p.days.find(x => x.id === t.dataset.did); if (!d) return;
    d.items.splice(Number(t.dataset.idx), 1); save(); closeOv();
  },
  /* 0.1.5 — zrušenie supersérie: cviky zostanú v dni, zmizne len zoskupenie */
  delSs: (t) => {
    const p = plan(t.dataset.pid); const d = p && p.days.find(x => x.id === t.dataset.did); if (!d) return;
    const ssId = t.dataset.id;
    const g = (d.ssg || []).find(x => x.id === ssId);
    askConfirm('Odstrániť supersériu?', (g ? g.name + ' — ' : '') +
      'zruší sa len zoskupenie, cviky zostanú v dni.', 'Odstrániť', () => {
      d.items.forEach(x => { if (x.ss === ssId) x.ss = null; });
      d.ssg = (d.ssg || []).filter(x => x.id !== ssId);
      save(); render(); toast('Superséria odstránená');
    }, true);
  },
  /* 0.1.4 fix — rozcvičovacie série. Z riadku plánu pridá jednu a otvorí úpravu,
     v úprave (data-stay) pridá ďalšiu a sheet nechá otvorený. */
  addWarm: (t) => {
    const p = plan(t.dataset.pid); const d = p && p.days.find(x => x.id === t.dataset.did);
    const it = d && d.items[Number(t.dataset.idx)]; if (!it) return;
    if (!it.warm) it.warm = [];
    if (t.dataset.stay) readItemForm(it);
    it.warm.push({ r: null, w: null });
    save();
    if (t.dataset.stay) { render(); return; }
    openOv({ t: 'editItem', pid: p.id, did: d.id, idx: Number(t.dataset.idx) });
  },
  delWarm: (t) => {
    const p = plan(t.dataset.pid); const d = p && p.days.find(x => x.id === t.dataset.did);
    const it = d && d.items[Number(t.dataset.idx)]; if (!it || !it.warm) return;
    readItemForm(it);
    it.warm.splice(Number(t.dataset.wi), 1);
    save(); render();
  },
  /* 0.1.4 fix — rozbalenie zvyšku databázy pri výmene cviku */
  pickExAll: () => {
    const o = ui.overlays[ui.overlays.length - 1]; if (!o) return;
    o.showAll = !o.showAll; render();
  },
  calView: (t) => { ui.calView = t.dataset.id; render(); },
  week: (t) => { ui.weekOff += Number(t.dataset.id); render(); },
  month: (t) => { ui.monthOff += Number(t.dataset.id); render(); },
  calDay: (t) => { ui.calDay = t.dataset.id; render(); },
  /* 0.1.4 — naplánovaný termín sa otvorí ako náhľad (nie rovno zápis) */
  evt: (t) => {
    const s = S.sessions.find(x => x.id === t.dataset.id); if (!s) return;
    if (s.status === 'missed') { ui.stack = []; push('client', s.clientId); return; }
    ui.stack = []; push('session', s.id);
  },
  /* 0.1.4 — jednorazová výmena cviku v náhľade termínu aj priamo v zápise */
  swapPlanned: (t) => openOv({ t: 'swapEx', id: t.dataset.id, idx: Number(t.dataset.idx) }),
  logSwapEx: (t) => openOv({ t: 'swapEx', log: true, ei: Number(t.dataset.ei) }),
  doSwapEx: (t) => {
    const ex = exOf(t.dataset.ex); if (!ex) return;
    if (t.dataset.log) {                                  // výmena priamo v zápise
      const d = ui.draft; if (!d) { closeOv(); return; }
      const e = d.exs[Number(t.dataset.ei)]; if (!e) { closeOv(); return; }
      const last = lastNumbersFor(d.clientId, ex.id);
      e.exId = ex.id; e.name = ex.name; e.rows = null; e.open = false;
      e.sets = last ? last.sets : e.sets;
      e.reps = last ? last.r : e.reps;
      e.w = last ? last.w : (ex.base ? roundTo(ex.base * 0.5, qFor(ex)) : 0);
      e.warm = [];                                        // rozcvičenie patrilo pôvodnému cviku
      closeOv(); toast('Cvik vymenený za ' + ex.name);
      return;
    }
    const s = sessById(t.dataset.id); if (!s) return;
    const items = plannedCopy(s);
    const i = Number(t.dataset.idx);
    if (!items[i]) { closeOv(); return; }
    items[i].exId = ex.id;
    s.exsPlan = items;
    save(); closeOv(); render(); toast('Cvik vymenený za ' + ex.name);
  },
  /* 0.1.4 fix — odstránenie cviku z náhľadu; opäť len pre tento tréning */
  delPlannedEx: (t) => {
    const s = sessById(t.dataset.id); if (!s) return;
    const i = Number(t.dataset.idx);
    const items = plannedCopy(s);
    const it = items[i]; if (!it) return;
    const ex = exOf(it.exId);
    askConfirm('Odstrániť ' + (ex ? ex.name : 'cvik') + '?',
      'Odstráni sa len z tohto tréningu, plán zostáva nezmenený.', 'Odstrániť', () => {
      items.splice(i, 1);
      s.exsPlan = items;
      save(); render(); toast('Cvik odstránený z tréningu');
    }, true);
  },

  /* prílohy klienta — bez servera, ukladá sa len názov a veľkosť súboru */
  pickFiles: (t) => {
    const cid = t.dataset.id;
    let inp = $('#filePick');
    if (!inp) {
      inp = document.createElement('input');
      inp.type = 'file'; inp.id = 'filePick'; inp.multiple = true;
      inp.style.cssText = 'position:absolute;width:0;height:0;opacity:0;pointer-events:none';
      elApp.appendChild(inp);
    }
    inp.onchange = () => {
      const c = client(inp.dataset.cid); const list = Array.from(inp.files || []);
      if (c && list.length) {
        c.files = c.files || [];
        list.forEach(f => c.files.push({
          id: uid('f'), name: f.name, size: f.size, type: f.type || '', added: ymd(today())
        }));
        save(); render();
        toast(list.length === 1 ? 'Príloha pridaná' : nf(list.length) + ' prílohy pridané');
      }
      inp.value = '';
    };
    inp.dataset.cid = cid;
    inp.click();
  },
  delFile: (t) => {
    const c = client(t.dataset.id); if (!c || !c.files) return;
    const f = c.files.find(x => x.id === t.dataset.fid); if (!f) return;
    askConfirm('Odstrániť prílohu?', f.name, 'Odstrániť', () => {
      c.files = c.files.filter(x => x.id !== f.id);
      save(); render(); toast('Príloha odstránená');
    }, true);
  },

  clientView: (t) => {
    ui.overlays = []; ui.cvAsk = false; ui.cvDay = null; ui.cvTab = 'terminy';
    openOv({ t: 'clientView', id: t.dataset.id });
  },
  /* 0.1.4 fix — fixný klient si voľné hodiny rozbalí až žiadosťou o termín
     0.1.5 — u fixného klienta je to „Nahradiť termín“ v prehľade budúceho týždňa */
  cvAsk: () => { ui.cvAsk = true; render(); },
  cvTab: (t) => { ui.cvTab = t.dataset.id; render(); },
  code: () => openOv({ t: 'code' }),
  submitCode: () => {
    const v = ($('#f-code').value || '').trim();
    const o = ui.overlays[ui.overlays.length - 1];
    o.val = v;
    if (v.length !== 6) { o.err = 'Kód má presne 6 znakov.'; render(); return; }
    if (!S.clients.length) { o.err = 'Tomuto kódu zatiaľ nepatrí žiadny klient.'; render(); return; }
    ui.overlays = []; ui.cvAsk = false; ui.cvDay = null; ui.cvTab = 'terminy';
    openOv({ t: 'clientView', id: S.clients[0].id });
  },
  reset: () => askConfirm('Obnoviť pôvodný stav?', 'Všetky zmeny v tejto ukážke sa zahodia.', 'Obnoviť', () => {
    resetAll(); ui.stack = []; ui.overlays = []; ui.search = ''; ui.weekOff = 0; ui.monthOff = 0; render(); toast('Obnovené');
  }),

  /* ---------- zápis tréningu ---------- */
  /* 0.1.4 fix — zápis z profilu klienta ide cez ten istý náhľad ako z kalendára */
  prepLog: (t) => {
    ui.overlays = [];
    ui.prep = makePrep(t.dataset.id);
    ui.stack = ui.stack.filter(x => !(x.v === 'session' && x.id === PREP));
    push('session', PREP);
  },
  logStart: (t) => {
    ui.overlays = [];
    // 0.1.4 — zápis z náhľadu prevezme jeho deň, dátum aj jednorazovo vymenené cviky
    const s = t.dataset.sid ? sessById(t.dataset.sid) : null;
    ui.draft = makeDraft(t.dataset.id, s ? s.dayId : null, s ? s.date : (t.dataset.date || null), s);
    if (s && s.id !== PREP) ui.draft.plannedId = s.id;
    openOv({ t: 'log' });
  },
  switchDay: () => openOv({ t: 'dayPick' }),
  useDay: (t) => {
    const d = ui.draft; const c = client(d.clientId);
    const nd = makeDraft(c.id, t.dataset.id, d.date);
    nd.note = d.note; nd.plannedId = d.plannedId;
    ui.draft = nd; closeOv();
  },
  step: (t) => {
    const d = ui.draft; if (!d) return;
    const e = d.exs[Number(t.dataset.ei)]; if (!e) return;
    const f = t.dataset.f, dir = Number(t.dataset.dir);
    let v;
    if (f === 'w') { v = Math.max(0, Math.round(((exBest(e).w || 0) + dir * 2.5) * 10) / 10); setExBest(e, 'w', v); }
    else if (f === 'sets') { v = Math.max(0, exSets(e) + dir); setExSets(e, v); }
    else { v = Math.max(0, (exBest(e).r || 0) + dir); setExBest(e, 'reps', v); }
    const inp = $('input[data-in="set' + f + '"][data-ei="' + t.dataset.ei + '"]');
    if (inp) inp.value = v ? nf(v, Math.abs(v % 1) > 0.001 ? 1 : 0) : '';
  },
  /* 0.1.4 — rozpísanie cviku na jednotlivé série */
  logExpand: (t) => {
    const e = ui.draft && ui.draft.exs[Number(t.dataset.ei)]; if (!e) return;
    e.open = !e.open;
    if (e.open) ensureRows(e);
    render();
  },
  logAddSet: (t) => {
    const e = ui.draft && ui.draft.exs[Number(t.dataset.ei)]; if (!e) return;
    const rows = ensureRows(e);
    const l = rows[rows.length - 1] || { r: 0, w: 0 };
    rows.push({ r: l.r, w: l.w });
    render();
  },
  /* rozcvičovacie série priamo v zápise — nepovinné, mimo pracovných sérií */
  logAddWarm: (t) => {
    const e = ui.draft && ui.draft.exs[Number(t.dataset.ei)]; if (!e) return;
    if (!e.warm) e.warm = [];
    e.warm.push({ r: null, w: null });
    render();
  },
  logDelWarm: (t) => {
    const e = ui.draft && ui.draft.exs[Number(t.dataset.ei)]; if (!e || !e.warm) return;
    e.warm.splice(Number(t.dataset.wi), 1);
    render();
  },
  /* 0.1.5 — polia rozcvičenia sú skryté, kým sa blok nerozbalí */
  logWarmToggle: (t) => {
    const e = ui.draft && ui.draft.exs[Number(t.dataset.ei)]; if (!e) return;
    e.warmOpen = !e.warmOpen; render();
  },
  rowStep: (t) => {
    const e = ui.draft && ui.draft.exs[Number(t.dataset.ei)]; if (!e || !e.rows) return;
    const r = e.rows[Number(t.dataset.ri)]; if (!r) return;
    const f = t.dataset.f, dir = Number(t.dataset.dir);
    let v;
    if (f === 'w') v = r.w = Math.max(0, Math.round(((Number(r.w) || 0) + dir * 2.5) * 10) / 10);
    else v = r.r = Math.max(0, (Number(r.r) || 0) + dir);
    const inp = $('input[data-in="row' + f + '"][data-ei="' + t.dataset.ei + '"][data-ri="' + t.dataset.ri + '"]');
    if (inp) inp.value = v ? nf(v, Math.abs(v % 1) > 0.001 ? 1 : 0) : '';
  },
  logDelEx: (t) => {
    const i = Number(t.dataset.ei);
    const e = ui.draft.exs[i]; if (!e) return;
    askConfirm('Odstrániť ' + e.name + '?', 'Zapísané čísla pri tomto cviku sa stratia.', 'Odstrániť', () => {
      ui.draft.exs.splice(i, 1); render();
    }, true);
  },
  askCloseLog: () => {
    const d = ui.draft;
    const any = d && d.exs.some(e => exSets(e) > 0 && exBest(e).r > 0);
    if (!any) { ui.draft = null; closeOv(); return; }
    askConfirm('Zahodiť tréning?', 'Zapísané čísla sa neuložia.', 'Zahodiť', () => {
      // 0.1.4 — po zahodení zostávame tam, odkiaľ sa zápis otvoril
      ui.draft = null; ui.overlays = []; render();
    }, true);
  },
  /* 0.1.4 fix — zavretie náhľadu pred zápisom zahodí aj rozrobený náhľad */
  closePrep: () => { ui.prep = null; pop(); },
  saveLog: () => {
    const d = ui.draft; if (!d) return;
    const exs = d.exs.map(e => {
      const b = exBest(e);
      const o = { exId: e.exId, name: e.name, note: e.note, sets: exSets(e), reps: b.r, w: b.w };
      // rozcvičovacie série sa uložia tak, ako boli zapísané (aj prázdne)
      if ((e.warm || []).length) o.warm = warmCopy(e.warm);
      return o;
    }).filter(e => e.sets > 0 && e.reps > 0);
    if (!exs.length) { toast('Zapíš aspoň jeden cvik so sériami a opakovaniami'); return; }
    const s = {
      id: uid('s'), clientId: d.clientId, date: d.date, time: (client(d.clientId) || {}).time || '17:00',
      planId: d.planId, dayId: d.dayId, dayName: d.dayName, status: 'done', exs: exs, note: d.note
    };
    if (d.plannedId) S.sessions = S.sessions.filter(x => x.id !== d.plannedId);
    S.sessions.push(s);
    const c = client(d.clientId);
    if (c && c.flag) c.flag = null;
    if (isPrepaid(c)) c.left = Math.max(0, (Number(c.left) || 0) - 1);
    save();
    // 0.1.4 — uloženie nikam neodskakuje; náhľad, z ktorého sa zapisovalo, už neplatí
    ui.draft = null; ui.overlays = []; ui.prep = null;
    ui.stack = ui.stack.filter(x => !(x.v === 'session' && (x.id === d.plannedId || x.id === PREP)));
    render();
    toast('Tréning uložený');
  },

  /* ---------- posuvník dní v Pokroku ---------- */
  planDay: (t) => {
    const cs = curScreen();
    const c = client(cs.id); if (!c) return;
    const p = plan(c.planId); if (!p) return;
    ui.planDay = Math.max(0, Math.min(p.days.length - 1, (ui.planDay || 0) + Number(t.dataset.id)));
    render();
  },

  /* ---------- kalendár: možnosti, voľno, operatívny termín ---------- */
  calMenu: () => openOv({ t: 'calMenu' }),
  overview: () => { closeOv(); openOv({ t: 'overview' }); },
  workMode: () => { closeOv(); openOv({ t: 'workMode' }); },
  addOff: () => openOv({ t: 'offEdit' }),
  saveOff: () => {
    const from = ($('#f-offfrom').value || '').trim();
    const to = ($('#f-offto').value || '').trim() || from;
    if (!from) { toast('Vyber dátum od'); return; }
    const a2 = from <= to ? from : to, b2 = from <= to ? to : from;
    S.off = S.off || [];
    S.off.push({ id: uid('o'), from: a2, to: b2, note: ($('#f-offnote').value || '').trim() });
    save(); closeOv(); toast('Voľno pridané');
  },
  delOff: (t) => {
    const o = (S.off || []).find(x => x.id === t.dataset.id); if (!o) return;
    askConfirm('Zmazať voľno?', fmtD(o.from) + (o.to !== o.from ? ' – ' + fmtD(o.to) : ''), 'Zmazať', () => {
      S.off = S.off.filter(x => x.id !== o.id); save(); render(); toast('Voľno zmazané');
    }, true);
  },
  addOpAppt: (t) => openOv({ t: 'opAppt', date: t.dataset.id || ymd(today()) }),
  saveOpAppt: () => {
    const o = ui.overlays[ui.overlays.length - 1];
    const cl = client($('#f-opclient').value);
    if (!cl) { toast('Vyber klienta'); return; }
    const date = ($('#f-opdate').value || o.date);
    const time = ($('#f-optime').value || cl.time || '17:00');
    const p = plan(cl.planId);
    let day = p && p.days.length ? p.days[0] : null;
    if (p && p.days.length) {
      const prev = S.sessions.filter(x => x.clientId === cl.id);
      const li = prev.length ? p.days.findIndex(dd => dd.id === prev[prev.length - 1].dayId) : -1;
      day = p.days[(li + 1) % p.days.length];
    }
    const ns = {
      id: uid('s'), clientId: cl.id, date: date, time: time,
      planId: p ? p.id : null, dayId: day ? day.id : null,
      dayName: day ? day.name : 'Tréning', status: 'planned', exs: [], note: ''
    };
    S.sessions.push(ns);
    const hit = addConflicts(ns);                 // 0.1.4 — kolízia s iným termínom
    save(); closeOv(); ui.calDay = date; render();
    toast(hit ? 'Termín pridaný — kolízia v kalendári' : 'Termín pridaný');
  },

  /* ---------- 0.1.3: presun a zrušenie termínu ---------- */
  postponeAppt: (t) => openOv({ t: 'postpone', id: t.dataset.id }),
  savePostpone: (t) => {
    const s = S.sessions.find(x => x.id === t.dataset.id); if (!s) return;
    const nd = ($('#f-ppdate').value || '').trim();
    const nt = ($('#f-pptime').value || '').trim();
    if (!nd) { toast('Vyber nový dátum'); return; }
    s.date = nd;
    if (nt) s.time = nt;
    save(); closeOv(); ui.calDay = nd; render();
    toast('Termín presunutý na ' + fmtD(nd));
  },
  cancelAppt: (t) => {
    const s = S.sessions.find(x => x.id === t.dataset.id); if (!s) return;
    const c = client(s.clientId);
    askConfirm('Zrušiť termín?', (c ? c.name + ' · ' : '') + fmtDW(s.date) + ' ' + (s.time || '') +
      ' — termín sa odstráni z kalendára.', 'Zrušiť termín', () => {
      S.sessions = S.sessions.filter(x => x.id !== s.id);
      save(); render(); toast('Termín zrušený');
    }, true);
  },

  /* ---------- 0.1.4: nedostupnosť klienta (od–do alebo neurčito) ---------- */
  unavail: (t) => { closeOv(); openOv({ t: 'unavail', id: t.dataset.id }); },
  unMode: (t) => {
    const o = ui.overlays[ui.overlays.length - 1]; if (!o) return;
    if ($('#f-unfrom')) o.from = $('#f-unfrom').value;
    if ($('#f-unto')) o.to = $('#f-unto').value;
    o.mode = t.dataset.id;
    render();
  },
  saveUnavail: (t) => {
    const c = client(t.dataset.id); if (!c) return;
    const o = ui.overlays[ui.overlays.length - 1] || {};
    const from = ($('#f-unfrom') ? $('#f-unfrom').value : '').trim();
    const to = (o.mode === 'range' && $('#f-unto')) ? ($('#f-unto').value || '').trim() : '';
    if (o.mode === 'range' && !to) { toast('Vyber dátum do'); return; }
    if (to && from && to < from) { toast('Dátum do je pred dátumom od'); return; }
    c.holiday = true;
    c.holFrom = from || ymd(today());
    c.holTo = to || null;
    save(); closeOv(); render();
    toast(c.name.split(' ')[0] + ' — ' + unavailLabel(c).charAt(0).toLowerCase() + unavailLabel(c).slice(1));
  },
  endUnavail: (t) => {
    const c = client(t.dataset.id); if (!c) return;
    c.holiday = false; c.holFrom = null; c.holTo = null;
    save(); closeOv(); render();
    toast('Nedostupnosť zrušená');
  },

  /* ---------- 0.1.4: kolízia termínov ---------- */
  cfKeep: (t) => {
    S.conflicts = (S.conflicts || []).filter(x => x.id !== t.dataset.id);
    save(); render(); toast('Termíny zostali oba');
  },
  cfReplace: (t) => {
    const cf = (S.conflicts || []).find(x => x.id === t.dataset.id); if (!cf) return;
    S.sessions = S.sessions.filter(x => x.id !== cf.oldId);
    S.conflicts = S.conflicts.filter(x => x.id !== cf.id);
    save(); render(); toast('Pôvodný termín nahradený');
  },
  cfCancel: (t) => {
    const cf = (S.conflicts || []).find(x => x.id === t.dataset.id); if (!cf) return;
    S.sessions = S.sessions.filter(x => x.id !== cf.newId);
    S.conflicts = S.conflicts.filter(x => x.id !== cf.id);
    save(); render(); toast('Nový termín zrušený');
  },

  /* ---------- 0.1.3: predplatené tréningy — doplnenie balíka ---------- */
  topUp: (t) => openOv({ t: 'topUp', id: t.dataset.id }),
  saveTopUp: (t) => {
    const c = client(t.dataset.id); if (!c) return;
    const n = Math.max(1, Math.round(num($('#f-topup').value)) || 0);
    c.platba = 'predplatne';
    c.prepaid = n;
    c.left = n;
    save(); closeOv(); render(); toast('Balík doplnený na ' + nf(n) + ' tréningov');
  },
  tuStep: (t) => {
    const inp = $('#f-topup'); if (!inp) return;
    inp.value = nf(Math.max(1, (Math.round(num(inp.value)) || 0) + Number(t.dataset.id)));
  },

  /* ---------- 0.1.3: pracovné hodiny trénera ---------- */
  workHrs: () => { closeOv(); openOv({ t: 'workHrs' }); },
  saveWorkHrs: () => {
    const a = Math.max(0, Math.min(23, Math.round(num($('#f-wfrom').value))));
    const b = Math.max(a + 1, Math.min(24, Math.round(num($('#f-wto').value))));
    S.coach.workFrom = a; S.coach.workTo = b;
    // 0.1.4 — pauza; obe polia prázdne = bez pauzy
    const bfs = ($('#f-bfrom').value || '').trim(), bts = ($('#f-bto').value || '').trim();
    if (bfs === '' || bts === '') { S.coach.breakFrom = null; S.coach.breakTo = null; }
    else {
      const bf = Math.max(a, Math.min(b - 1, Math.round(num(bfs))));
      const bt = Math.max(bf + 1, Math.min(b, Math.round(num(bts))));
      S.coach.breakFrom = bf; S.coach.breakTo = bt;
    }
    save(); closeOv(); render();
    toast('Pracovné hodiny uložené' + (breakLabel() ? ' · pauza ' + breakLabel() : ''));
  },

  /* ---------- 0.1.3: rezervácia v pohľade klienta (kozmetická) ---------- */
  cvBookDay: (t) => { ui.cvDay = t.dataset.id; render(); },
  cvRequest: (t) => {
    toast('Žiadosť o termín ' + fmtD(t.dataset.date) + ' ' + t.dataset.time + ' odoslaná');
  }
,

  /* ---------- 0.1.5: rozcvička ---------- */
  warmup: () => { ui.overlays = []; ui.wu = wuFresh(); push('warmup'); },
  wuPick: (t) => {
    const k = wuKey(t.dataset.pid, t.dataset.kind, t.dataset.nm);
    if (ui.wu.sel[k]) delete ui.wu.sel[k]; else ui.wu.sel[k] = true;
    render();
  },
  wuSkipWarm: () => { ui.wu.skipWarm = !ui.wu.skipWarm; render(); },
  wuMyo: (t) => { ui.wu.myo = t.dataset.id; render(); },
  wuNext: () => {
    const ph = WU_PHASES[ui.wu.phase];
    if (ph && ph.id === 'myo' && ui.wu.myo === 'nie') ui.wu.skipped[ph.id] = true;
    else if (ph) delete ui.wu.skipped[ph.id];
    ui.wu.phase++; render();
  },
  wuSkip: () => {
    const ph = WU_PHASES[ui.wu.phase];
    if (ph) ui.wu.skipped[ph.id] = true;
    ui.wu.phase++; render();
  },
  wuBack: () => { if (ui.wu.phase > 0) { ui.wu.phase--; render(); } else pop(); },
  wuRestart: () => { ui.wu = wuFresh(); render(); },

  /* ---------- databáza cvikov ---------- */
  exDb: () => { ui.dbSearch = ''; ui.overlays = []; push('exdb'); },
  exNote: (t) => openOv({ t: 'exNote', id: t.dataset.id }),
  saveExNote: (t) => {
    const e = exOf(t.dataset.id); if (!e) return;
    e.note = ($('#f-exnoteedit').value || '').trim();
    save(); closeOv(); toast('Poznámka uložená');
  },
  newDbEx: () => openOv({ t: 'newDbEx' }),
  saveDbEx: () => {
    const nm = ($('#f-dbname').value || '').trim();
    if (!nm) { $('#f-dbname').focus(); toast('Zadaj názov cviku'); return; }
    S.lib.push({ id: uid('x'), name: nm, cat: $('#f-dbcat').value, sub: '',
      variant: $('#f-dbvar').value, base: 0, note: ($('#f-dbnote').value || '').trim(), custom: true });
    save(); closeOv(); toast('Cvik pridaný');
  },
  delDbEx: (t) => {
    const e = exOf(t.dataset.id); if (!e) return;
    askConfirm('Odstrániť cvik?', e.name + ' sa odstráni z databázy.', 'Odstrániť', () => {
      S.lib = S.lib.filter(x => x.id !== e.id); save(); render(); toast('Cvik odstránený');
    }, true);
  }
};

/* ---------- delegácia ---------- */
let suppressClick = false;
elApp.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); return; }
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(t, e);
});
elApp.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target.closest('[role="button"][data-act]');
  if (!t) return;
  e.preventDefault();
  const fn = ACT[t.dataset.act]; if (fn) fn(t, e);
});
elApp.addEventListener('input', e => {
  const t = e.target.closest('[data-in]');
  if (!t) return;
  const k = t.dataset.in;
  if (k === 'clientSearch') {
    ui.search = t.value;
    const box = $('#clientList'); if (box) box.innerHTML = clientListHTML();
  } else if (k === 'exSearch') {
    ui.exSearch = t.value;
    const o = ui.overlays[ui.overlays.length - 1];
    if (o) o.custom = false;
    const box = $('#exResults');
    if (box) {
      const tmp = document.createElement('div');
      tmp.innerHTML = ovPickEx(o);
      const nu = tmp.querySelector('#exResults');
      if (nu) box.innerHTML = nu.innerHTML;
    }
  } else if (k === 'setw' || k === 'setsets' || k === 'setreps') {
    const d = ui.draft; if (!d) return;
    const ex = d.exs[Number(t.dataset.ei)]; if (!ex) return;
    // 0.1.4 — zbalený cvik: počet sérií a najlepší výkon (prepíše všetky série)
    if (k === 'setw') setExBest(ex, 'w', num(t.value));
    else if (k === 'setsets') setExSets(ex, Math.round(num(t.value)));
    else setExBest(ex, 'reps', Math.round(num(t.value)));
  } else if (k === 'rowr' || k === 'roww') {
    const ex = ui.draft && ui.draft.exs[Number(t.dataset.ei)];
    const r = ex && ex.rows && ex.rows[Number(t.dataset.ri)];
    if (!r) return;
    if (k === 'roww') r.w = num(t.value); else r.r = Math.round(num(t.value));
  } else if (k === 'lwr' || k === 'lww') {
    // rozcvičovacia séria v zápise — prázdne pole zostáva prázdne
    const ex = ui.draft && ui.draft.exs[Number(t.dataset.ei)];
    const w = ex && ex.warm && ex.warm[Number(t.dataset.wi)];
    if (!w) return;
    const empty = t.value.trim() === '';
    if (k === 'lww') w.w = empty ? null : Math.max(0, num(t.value));
    else w.r = empty ? null : Math.max(0, Math.round(num(t.value)));
  } else if (k === 'waist') {
    const c = client(t.dataset.id); if (!c) return;
    c.waist = t.value; save();
  } else if (k === 'exnote') {
    const ex = ui.draft && ui.draft.exs[Number(t.dataset.ei)]; if (ex) ex.note = t.value;
  } else if (k === 'sessnote') {
    if (ui.draft) ui.draft.note = t.value;
  } else if (k === 'logdate') {
    if (ui.draft && t.value) ui.draft.date = t.value;
  } else if (k === 'dbSearch') {
    ui.dbSearch = t.value;
    const box = $('#dbList'); if (box) box.innerHTML = dbListHTML();
  }
});
/* dlhé podržanie na riadku klienta */
let pressT = null;
elApp.addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-press]');
  if (!t || e.target.closest('button')) return;
  clearTimeout(pressT);
  pressT = setTimeout(() => {
    suppressClick = true;
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
    openOv({ t: 'clientMenu', id: t.dataset.press });
  }, 520);
});
['pointerup', 'pointercancel', 'pointermove', 'scroll'].forEach(ev =>
  elApp.addEventListener(ev, () => clearTimeout(pressT), true));

/* ============================================================
   0.1.4 — gestá: potiahnutie riadku doľava a presúvanie ťahaním

   Obe bežia na delegovaných pointer udalostiach nad #app. Posun je iba
   inline transform, takže prekreslenie ho automaticky zahodí — stav sa
   nikde neukladá.
   ============================================================ */
let swSt = null, dragSt = null;
/* po geste sa nasledujúci klik zahodí; poistka časovačom, keby klik vôbec neprišiel */
function suppressNextClick() {
  suppressClick = true;
  clearTimeout(suppressNextClick._t);
  suppressNextClick._t = setTimeout(() => { suppressClick = false; }, 400);
}
function swCloseAll(except) {
  $$('.sw.swopen').forEach(el => {
    if (el === except) return;
    const b = $('.swbody', el);
    if (b) b.style.transform = '';
    el.classList.remove('swopen');
  });
}
elApp.addEventListener('pointerdown', e => {
  // 1) úchyt na presúvanie cviku v pláne
  const g = e.target.closest('.grip');
  if (g) {
    const wrap = g.closest('[data-drow]');
    const list = g.closest('[data-dlist]');
    if (!wrap || !list) return;
    swCloseAll(null);
    const rows = $$('[data-drow]', list);
    const from = rows.indexOf(wrap);
    if (from < 0) return;
    dragSt = { list: list, wrap: wrap, rows: rows,
      rects: rows.map(r => r.getBoundingClientRect()),
      from: from, to: from, y0: e.clientY };
    wrap.classList.add('dragging');
    list.classList.add('dragon');
    e.preventDefault();
    return;
  }
  // odkryté akcie sa nesmú zavrieť skôr, než na ne dopadne ťuknutie
  if (e.target.closest('.swacts')) return;
  // 2) potiahnutie riadku doľava
  const body = e.target.closest('.swbody');
  if (!body) { swCloseAll(null); return; }
  const wrap = body.parentNode;
  swCloseAll(wrap);
  const acts = $('.swacts', wrap);
  swSt = { wrap: wrap, body: body, w: acts ? acts.offsetWidth : 0,
    x0: e.clientX, y0: e.clientY, open: wrap.classList.contains('swopen'), axis: null, off: 0 };
});
elApp.addEventListener('pointermove', e => {
  if (dragSt) {
    const dy = e.clientY - dragSt.y0;
    dragSt.wrap.style.transform = 'translateY(' + dy + 'px)';
    const y = e.clientY, from = dragSt.from;
    let to = from;
    dragSt.rects.forEach((r, i) => {
      if (i === from) return;
      const mid = r.top + r.height / 2;
      if (i < from && y < mid) to = Math.min(to, i);
      if (i > from && y > mid) to = Math.max(to, i);
    });
    dragSt.to = to;
    const hh = dragSt.rects[from].height;
    dragSt.rows.forEach((el, i) => {
      if (i === from) return;
      let sh = 0;
      if (from < to && i > from && i <= to) sh = -hh;
      else if (from > to && i >= to && i < from) sh = hh;
      el.style.transform = sh ? 'translateY(' + sh + 'px)' : '';
    });
    e.preventDefault();
    return;
  }
  if (!swSt) return;
  const dx = e.clientX - swSt.x0, dy = e.clientY - swSt.y0;
  if (!swSt.axis) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    swSt.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (swSt.axis === 'x') swSt.wrap.classList.add('swdrag');
  }
  if (swSt.axis !== 'x' || !swSt.w) return;
  swSt.off = Math.max(-swSt.w, Math.min(0, (swSt.open ? -swSt.w : 0) + dx));
  swSt.body.style.transform = 'translateX(' + swSt.off + 'px)';
});
function endGesture(cancel) {
  if (dragSt) {
    const st = dragSt; dragSt = null;
    st.wrap.classList.remove('dragging');
    st.list.classList.remove('dragon');
    st.rows.forEach(el => { el.style.transform = ''; });
    suppressNextClick();
    if (!cancel && st.to !== st.from) {
      const key = String(st.list.dataset.dlist).split('|');
      const p = plan(key[0]);
      const d = p && p.days.find(x => x.id === key[1]);
      if (d && d.items[st.from]) {
        const it = d.items.splice(st.from, 1)[0];
        d.items.splice(st.to, 0, it);
        // ak cvik pristál medzi dvoma cvikmi tej istej supersérie, prevezme ju
        const prev = d.items[st.to - 1], next = d.items[st.to + 1];
        if (prev && next && (prev.ss || null) === (next.ss || null)) it.ss = prev.ss || null;
        save();
      }
    }
    render();
    return;
  }
  if (!swSt) return;
  const st = swSt; swSt = null;
  st.wrap.classList.remove('swdrag');
  if (st.axis !== 'x') {
    // ťuknutie do otvoreného riadku ho iba zavrie
    if (st.open) { st.body.style.transform = ''; st.wrap.classList.remove('swopen'); suppressNextClick(); }
    return;
  }
  suppressNextClick();
  const open = !cancel && st.off < -st.w / 2;
  st.body.style.transform = open ? 'translateX(' + (-st.w) + 'px)' : '';
  st.wrap.classList.toggle('swopen', open);
}
elApp.addEventListener('pointerup', () => endGesture(false));
elApp.addEventListener('pointercancel', () => endGesture(true));

/* ---------- štart ---------- */
S = load();
render();
window.addEventListener('pagehide', save);

/* ============================================================
   Úvodné predstavenie — len v prázdnom režime (?mode=empty),
   spustí sa po dokreslení loga. Raz za reláciu prehliadača.
   ============================================================ */
/* ============================================================
   Vysvetlivky k sekciám — iba v prázdnej verzii.
   Namiesto karuselu sa pri prvom otvorení sekcie vysunie zdola
   panel, ktorý čiastočne prekryje obrazovku, krátko povie načo
   sekcia je a nechá vidieť, čo je pod ním.
   ============================================================ */
const HINTS = {
  klienti: { i: 'users', t: 'Klienti', d: 'Srdce appky. Navrchu vidíš, kto potrebuje pozornosť — kto dlho nebol alebo neodpovedal. Klienta pridáš ako fixného (pevné dni) alebo operatívneho (termín kedykoľvek).' },
  kalendar: { i: 'cal', t: 'Kalendár', d: 'Týždeň všetkých klientov v jednom pohľade. Fixní sa doplnia sami podľa svojich dní, operatívnych zapíšeš ručne. V mesiaci pod tromi bodkami je prehľad a pracovný režim.' },
  nastavenia: { i: 'gear', t: 'Nastavenia', d: 'Profil, členstvo a vstup do pohľadu klienta pomocou kódu.' },
  client: { i: 'users', t: 'Profil klienta', d: 'Záložky: Plán (tréningové plány a zápis tréningu), Pokrok (vývoj cvikov z aktívneho plánu), Váha (ak je pre klienta relevantná) a Info (údaje, dostupnosť, poznámka, prílohy).' },
  plan: { i: 'plan', t: 'Plán', d: 'Plán má dni a v nich cviky so sériami a opakovaniami. Cvik presunieš úchytom vpravo, potiahnutím doľava ho vymeníš alebo odstrániš.' },
  log: { i: 'bolt', t: 'Zápis tréningu', d: 'Zapisuje sa po cvikoch: počet sérií a najlepší výkon. Šípkou nadol cvik rozpíšeš na jednotlivé série, potiahnutím doľava ho odstrániš.' },
  exdb: { i: 'plan', t: 'Databáza cvikov', d: 'Celá zásoba cvikov podľa pohybových kategórií. Ku každému si môžeš uložiť poznámku a pridať vlastné cviky.' },
  warmup: { i: 'flame', t: 'Rozcvička', d: 'Sedem fáz od zahriatia po potenciáciu. Prechádzaš ich po poradí, v každej si vyberieš, čo klient robí. Myofasciálne uvoľnenie a dýchanie sa dajú preskočiť.' }
};
function hintSeen(k) {
  try { return !!sessionStorage.getItem(SKEY + '.hint.' + k); } catch (e) { return false; }
}
function markHint(k) {
  try { sessionStorage.setItem(SKEY + '.hint.' + k, '1'); } catch (e) {}
}
function showHint(k) {
  if (MODE !== 'empty') return;
  const def = HINTS[k];
  if (!def || hintSeen(k)) return;
  if ($('#hint')) return;
  markHint(k);
  const el = document.createElement('div');
  el.id = 'hint';
  el.innerHTML =
    '<div class="hn-card">' +
    '<div class="hn-grab"></div>' +
    '<div class="hn-row">' +
    '<div class="hn-ico">' + (I[def.i] || I.users) + '</div>' +
    '<div class="hn-txt"><div class="hn-t">' + esc(def.t) + '</div>' +
    '<div class="hn-d">' + esc(def.d) + '</div></div></div>' +
    '<button class="btn primary sm" data-hint="ok">Rozumiem</button>' +
    '</div>';
  elApp.appendChild(el);
  let done = false;
  function close() {
    if (done) return;
    done = true;
    el.classList.add('out');
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 260);
  }
  el.addEventListener('click', e => {
    if (e.target.closest('[data-hint]') || e.target === el) close();
  });
  hintClose = close;
}
let hintClose = null;
/* zavolá sa po každom prekreslení — kľúč sekcie podľa toho, čo je navrchu */
function hintKey() {
  if (ui.overlays.some(o => o.t === 'log')) return 'log';
  const t = curScreen();
  if (t.v === 'client') return 'client';
  if (t.v === 'plan') return 'plan';
  if (t.v === 'exdb') return 'exdb';
  if (t.v === 'warmup') return 'warmup';
  if (ui.stack.length) return null;
  return ui.tab;
}

/* ---------- úvodná animácia: logo sa vykreslí, potom odkryje aplikáciu ---------- */
(function () {
  const el = document.getElementById('splash');
  if (!el) { showHint(hintKey()); return; }
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  $$('.sp-draw', el).forEach(p => {
    let len = 600;
    try { len = p.getTotalLength() || 600; } catch (e) {}
    p.style.setProperty('--len', Math.ceil(len) + 1);
  });
  el.classList.add('go');
  let done = false;
  function finish() {
    if (done) return;
    done = true;
    el.classList.add('out');
    showHint(hintKey());
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 460);
  }
  el.addEventListener('click', finish);   // ťuknutím sa dá preskočiť
  setTimeout(finish, reduce ? 500 : 1850);
})();
})();
</script>
