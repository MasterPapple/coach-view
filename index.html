<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="theme-color" content="#0A0A0B">
<meta name="format-detection" content="telephone=no">
<title>Coach 0.1.5 — ukážkové dáta</title>
<style>
:root{
  --bg:#0A0A0B; --surface:#141416; --surface-2:#1E1E21; --line:#2A2A2E;
  --text:#FFFFFF; --muted:#8A8A93; --accent:#FFFFFF; --warn:#FFB020;
  --pad:16px; --r:12px;
  --glow:0 0 12px rgba(255,255,255,.35);
  --glow-soft:0 0 18px rgba(255,255,255,.18);
  --tabh:58px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:#000;color:var(--text);
  font:400 16px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  height:100dvh;overflow:hidden;display:flex;justify-content:center;align-items:stretch;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;user-select:none;-webkit-user-select:none}
input,textarea,select{font-size:16px}
.phone{position:relative;width:100%;max-width:420px;height:100dvh;background:var(--bg);overflow:hidden}
@media(min-width:520px){ .phone{border-left:1px solid var(--line);border-right:1px solid var(--line)} }

/* ---------- screens ---------- */
#screens{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.screen.push{animation:slide .15s ease-out}
@keyframes slide{from{transform:translateX(16px);opacity:.4}to{transform:none;opacity:1}}
.body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pb-tab{padding-bottom:calc(var(--tabh) + var(--sab) + 92px)}
.pb-act{padding-bottom:calc(var(--sab) + 96px)}
.pb-safe{padding-bottom:calc(var(--sab) + 28px)}

/* ---------- header ---------- */
.hdr{padding:calc(var(--sat) + 12px) var(--pad) 12px;background:var(--bg);border-bottom:1px solid var(--line);flex:none}
.hdr.plain{border-bottom:0;padding-bottom:4px}
.hdr h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em}
.hdr .sub{color:var(--muted);font-size:14px;margin-top:2px}
.navbar{display:flex;align-items:center;gap:8px;min-height:44px}
.navbar .ttl{font-size:17px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;color:var(--text);flex:none}
.iconbtn:active{background:var(--surface-2)}
.iconbtn.muted{color:var(--muted)}
.iconbtn.ghost{width:auto;min-width:44px;padding:0 10px;font-size:16px;color:var(--muted)}

/* ---------- generic ---------- */
.pad{padding:0 var(--pad)}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 var(--pad);margin-bottom:10px}
.label{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.card{background:var(--surface);border-radius:var(--r);padding:14px var(--pad)}
.card+.card{margin-top:10px}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px var(--pad);min-height:60px;width:100%;text-align:left;position:relative}
.row+.row::before{content:'';position:absolute;top:0;left:var(--pad);right:0;height:1px;background:var(--line)}
button.row:active,.row.tap:active{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mt{color:var(--muted);font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt{color:var(--muted);font-size:13px;text-align:right;flex:none;white-space:nowrap}
.chev{color:var(--muted);flex:none;display:flex}
.av{width:42px;height:42px;border-radius:21px;background:var(--surface-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;letter-spacing:.02em}
.av.lg{width:60px;height:60px;border-radius:30px;font-size:21px}
.av.sm{width:30px;height:30px;border-radius:15px;font-size:11px}
.dot{width:8px;height:8px;border-radius:4px;background:var(--warn);flex:none}
.warn{color:var(--warn)}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:14px;line-height:1.5}
.divider{height:1px;background:var(--line);margin:0 var(--pad)}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;
     border-radius:var(--r);font-size:17px;font-weight:600;background:var(--surface-2);color:var(--text);width:100%}
.btn:active{background:var(--line)}
.btn.primary{background:var(--accent);color:#0A0A0B;box-shadow:var(--glow)}
.btn.primary:active{box-shadow:0 0 6px rgba(255,255,255,.25);opacity:.92}
.btn.quiet{background:transparent;border:1px solid var(--line)}
.btn.quiet:active{background:var(--surface-2)}
.btn.danger{color:var(--warn);background:transparent;border:1px solid var(--line)}
.btn.sm{min-height:44px;font-size:15px}
.btn[disabled]{opacity:.4;box-shadow:none}
.fab{position:absolute;left:var(--pad);right:var(--pad);bottom:calc(var(--tabh) + var(--sab) + 14px);z-index:5}
.actionbar{position:absolute;left:0;right:0;bottom:0;padding:12px var(--pad) calc(12px + var(--sab));
  background:linear-gradient(to top,var(--bg) 62%,rgba(10,10,11,0));z-index:5}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--muted);min-height:38px;display:flex;align-items:center}
.chip.on{color:var(--text);border-color:var(--text);background:var(--surface-2)}

/* ---------- segmented ---------- */
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line)}

/* ---------- inputs ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.inp{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
     padding:13px 14px;font-size:16px;color:var(--text);min-height:50px;-webkit-appearance:none;appearance:none}
.inp:focus{outline:none;border-color:#4a4a52}
textarea.inp{min-height:84px;resize:none}
select.inp{background-image:none}
.searchwrap{position:relative;margin-top:12px}
.searchwrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchwrap .inp{padding-left:40px}

/* ---------- attention ---------- */
.attn{background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid rgba(255,176,32,.22)}
.attn .row{min-height:56px}
.attn .rsn{color:var(--warn);font-size:14px;margin-top:2px}

/* ---------- stats ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border-radius:var(--r);padding:12px 10px;text-align:center;min-width:0}
.tile .v{font-size:21px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .k{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}

/* ---------- chart ---------- */
.chartcard{background:var(--surface);border-radius:var(--r);padding:14px 10px 8px}
.chart svg{display:block;width:100%;height:auto}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 6px rgba(255,255,255,.55))}
.chart .dt{fill:var(--accent);filter:drop-shadow(0 0 5px rgba(255,255,255,.5))}
.chart .gr{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px;font-family:inherit}
/* 0.1.4 — každý zápis je viditeľný bod s bublinou (dátum, váha, opakovania) */
.chart .hit{fill:transparent;cursor:pointer}
.chart .dtg{outline:none}
.chart .tip{opacity:0;pointer-events:none;transition:opacity .12s ease-out}
.chart .dtg:hover .tip,.chart .dtg:focus .tip,.chart .dtg:active .tip{opacity:1}
.chart .tip rect{fill:var(--surface-2);stroke:var(--line);stroke-width:1}
.chart .tip text{fill:var(--text);font-size:9.5px;font-weight:600;font-family:inherit}
.chart .dtg:hover .dt,.chart .dtg:focus .dt{r:4}

/* ---------- PR ---------- */
.pr{display:flex;align-items:center;gap:12px;padding:12px var(--pad);position:relative}
.pr+.pr::before{content:'';position:absolute;top:0;left:var(--pad);right:0;height:1px;background:var(--line)}
.pr .v{font-weight:700;font-size:19px;text-shadow:var(--glow);white-space:nowrap}

/* ---------- log session ---------- */
.exc{background:var(--surface);border-radius:var(--r);padding:14px var(--pad) 8px;margin-bottom:12px}
.exc h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.exc .last{color:var(--muted);font-size:14px;margin-top:3px}
.setgrid{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:6px;align-items:center;margin-top:10px}
.setgrid .hd{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.setrow{display:contents}
.setrow .n{color:var(--muted);font-size:14px;font-weight:600;text-align:center}
.stp{display:flex;align-items:center;background:var(--surface-2);border-radius:10px;overflow:hidden;min-width:0}
.stp button{width:34px;height:46px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.stp button:active{background:var(--line);color:var(--text)}
.stp input{flex:1;min-width:0;width:100%;background:transparent;border:0;text-align:center;font-size:17px;font-weight:600;
  padding:0;height:46px;-webkit-appearance:none;appearance:none}
.stp input:focus{outline:none}
.ck{width:46px;height:46px;border-radius:23px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ck.on{border-color:var(--accent);background:var(--accent);color:#0A0A0B;box-shadow:var(--glow)}
.setdone .n{opacity:.45}
.setdone .stp{opacity:.45}
.exc .addset{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px;font-weight:600;min-height:46px;padding:0 4px;margin-top:4px}
.exc .addset:active{color:var(--text)}
.logfoot{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px var(--pad) calc(10px + var(--sab));z-index:5}

/* ---------- calendar ---------- */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 var(--pad)}
.daycard{background:var(--surface);border-radius:var(--r);padding:10px var(--pad) 6px;margin-bottom:8px}
.daycard.today{box-shadow:0 0 0 1px var(--line) inset}
.dayhd{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.dayhd .dn{font-weight:700;font-size:15px}
.dayhd .dd{color:var(--muted);font-size:13px}
.dayhd .td{margin-left:auto;font-size:11px;color:var(--text);text-shadow:var(--glow);font-weight:700;letter-spacing:.06em}
.evt{display:flex;align-items:center;gap:10px;padding:9px 0;min-height:52px;width:100%;text-align:left;position:relative}
.evt+.evt::before{content:'';position:absolute;top:0;left:40px;right:0;height:1px;background:var(--line)}
.evt:active{opacity:.6}
.evt .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;width:44px;flex:none}
.evt.planned .av{background:transparent;border-style:dashed}
.evt.planned .tm,.evt.planned .nm2{color:var(--muted)}
.evt.missed .av{border-color:var(--warn);color:var(--warn)}
.evt.missed .tm{color:var(--warn)}
.evt .nm2{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evt .sb{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 var(--pad)}
.mgrid .wd{text-align:center;color:var(--muted);font-size:11px;font-weight:600;padding:6px 0;text-transform:uppercase}
.mcell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;background:transparent}
.mcell.out{color:#4a4a52}
.mcell.on{background:var(--surface-2)}
.mcell.today{box-shadow:0 0 0 1px var(--text) inset}
.mcell .pips{display:flex;gap:2px;height:5px}
.mcell .pip{width:5px;height:5px;border-radius:3px;background:var(--muted)}
.mcell .pip.d{background:var(--text)}
.mcell .pip.m{background:var(--warn)}

/* ---------- overlays ---------- */
#overlay{position:absolute;inset:0;pointer-events:none;z-index:20}
/* isolation: každý overlay má vlastný stacking context — inak by .logfoot (z-index 5)
   prekryl neskorší sheet (napr. potvrdenie „Zahodiť tréning?“) a schoval jeho tlačidlá. */
.ov{position:absolute;inset:0;pointer-events:auto;isolation:isolate}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out;border-top:1px solid var(--line)}
@keyframes up{from{transform:translateY(28px)}to{transform:none}}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:6px 8px 6px var(--pad);border-bottom:1px solid var(--line);flex:none}
.sheet .sh .t{flex:1;font-size:17px;font-weight:700}
.sheet .sb2{overflow-y:auto;overscroll-behavior:contain;padding:16px var(--pad) calc(16px + var(--sab))}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.fs{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;animation:up .18s ease-out}

/* ---------- client view ---------- */
.cv{background:var(--bg)}
.cv .hero{padding:calc(var(--sat) + 28px) var(--pad) 4px;text-align:center}
.cv .hero .hi{color:var(--muted);font-size:15px;letter-spacing:.02em}
.cv .hero h2{margin:6px 0 0;font-size:34px;font-weight:700;letter-spacing:-.02em}
.cv .big{font-size:44px;font-weight:700;letter-spacing:-.03em;text-shadow:var(--glow)}
.cv .sec{margin-top:34px}
.cv .lbl{text-align:center;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.cv .dayrow{display:flex;align-items:center;gap:14px;padding:15px var(--pad);position:relative}
.cv .dayrow+.dayrow::before{content:'';position:absolute;top:0;left:var(--pad);right:var(--pad);height:1px;background:var(--line)}
.cv .mark{width:28px;height:28px;border-radius:14px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.cv .mark.on{background:var(--accent);color:#0A0A0B;border-color:var(--accent);box-shadow:var(--glow)}

/* ---------- toast ---------- */
#toast{position:absolute;left:var(--pad);right:var(--pad);bottom:calc(var(--tabh) + var(--sab) + 78px);z-index:60;
  pointer-events:none;display:flex;justify-content:center}
#toast div{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:11px 20px;
  font-size:15px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.6);animation:fade .15s ease-out}

/* ---------- tab bar ---------- */
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;
  height:calc(var(--tabh) + var(--sab));padding-bottom:var(--sab);
  background:rgba(10,10,11,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);user-select:none;-webkit-user-select:none}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.02em;min-height:44px}
#tabbar button.on{color:var(--text)}
#tabbar button.on svg{filter:drop-shadow(0 0 8px rgba(255,255,255,.55))}
#tabbar button.on span{text-shadow:0 0 10px rgba(255,255,255,.35)}
.hidetabs #tabbar{display:none}

/* úzke telefóny (SE a staršie) — nech sa polia pre váhu a opakovania nezmrštia */
@media (max-width:360px){
  :root{--pad:12px}
  .exc{padding-left:12px;padding-right:12px}
  .setgrid{grid-template-columns:18px 1fr 1fr 44px;gap:4px}
  .stp button{width:28px}
  .stp input{font-size:16px}
  .ck{width:44px;height:44px}
  .hdr h1{font-size:27px}
}
.empty{text-align:center;padding:56px var(--pad) 0}
.empty h2{margin:0 0 10px;font-size:23px;font-weight:700;letter-spacing:-.01em}
.empty p{margin:0 auto 24px;max-width:290px;color:var(--muted);font-size:15px;line-height:1.5}
.flash{animation:fl 1.4s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 1px rgba(255,255,255,.9),0 0 22px rgba(255,255,255,.35)}100%{box-shadow:none}}
/* ---------- úvodná animácia (AOC) ---------- */
#splash{position:absolute;inset:0;z-index:100;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
  padding-bottom:8vh;user-select:none;-webkit-user-select:none;cursor:pointer}
#splash.out{animation:spOut .42s ease-in forwards;pointer-events:none}
@keyframes spOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(1.05)}}
.sp-logo{width:130px;height:auto;overflow:visible;filter:drop-shadow(0 0 16px rgba(255,255,255,.26))}
.sp-logo path{fill:none;stroke:var(--accent);stroke-linecap:round;stroke-linejoin:round}
.sp-draw{stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600)}
#splash.go .sp-draw{animation:spDraw var(--dur,.8s) cubic-bezier(.62,.03,.28,1) var(--del,0s) forwards}
@keyframes spDraw{to{stroke-dashoffset:0}}
.sp-dot{fill:var(--accent);stroke:none;opacity:0;transform-box:fill-box;transform-origin:center}
#splash.go .sp-dot{animation:spPop .38s cubic-bezier(.2,1.5,.4,1) 1s forwards}
@keyframes spPop{from{opacity:0;transform:scale(.1)}to{opacity:1;transform:scale(1)}}
.sp-word{font-size:13px;font-weight:500;letter-spacing:.42em;text-indent:.42em;color:var(--text);opacity:0}
#splash.go .sp-word{animation:spFade .6s ease-out 1.02s forwards}
@keyframes spFade{from{opacity:0;transform:translateY(6px)}to{opacity:.86;transform:none}}
/* ---------- 0.1.2: zápis po cvikoch (bez sérií a časovača) ---------- */
.setgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center;margin-top:10px}
.setgrid3 .hd{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-align:center}

/* ---------- supersérie ---------- */
.ssgrp{border:1px solid var(--line);border-left:3px solid var(--text);border-radius:12px;
  padding:8px;margin:8px 0;background:rgba(255,255,255,.02)}
.sshd{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text);
  padding:2px 6px 8px;display:flex;align-items:center;gap:8px}
.sshd .nmx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 0.1.5 — hlavička supersérie je potiahnuteľná, preto musí mať plnú výšku dotyku */
.sshdsw{border-radius:9px;margin-bottom:2px}
.sshdsw .sshd{min-height:44px;padding:2px 6px;background:var(--surface)}
.ssgrp .row:first-of-type::before{display:none}
.ssgrp .exc{margin-bottom:8px}

/* ---------- pracovné voľno v kalendári ---------- */
.daycard.offday{border:1px solid rgba(255,176,32,.28)}
.offtag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,176,32,.14);color:var(--warn);
  border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;margin:6px 0 8px}
.mcell.off{background:rgba(255,176,32,.12)}

/* ---------- 0.1.4: potiahnutie doľava odkryje akcie riadku ---------- */
.sw{position:relative;overflow:hidden}
.sw .swacts{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:stretch}
.sw .swact{width:58px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);background:var(--surface-2);border-left:1px solid var(--line)}
.sw .swact:active{background:var(--line);color:var(--text)}
.sw .swact.danger{color:var(--warn)}
.sw .swbody{position:relative;background:var(--surface);touch-action:pan-y;
  transition:transform .16s ease-out;will-change:transform}
.sw.swdrag .swbody{transition:none}
/* oddeľovače — .row+.row už nesedí, riadky sú zabalené v .sw */
.list .sw+.sw .swbody::before,.list .row+.sw .swbody::before,.list .sw+.row::before{
  content:'';position:absolute;top:0;left:var(--pad);right:0;height:1px;background:var(--line)}
.sw.excsw{border-radius:var(--r);margin-bottom:12px;background:var(--surface)}
.sw.excsw .exc{margin-bottom:0}

/* ---------- 0.1.4: presúvanie cvikov v pláne ťahaním ---------- */
.grip{touch-action:none;cursor:grab}
.sw.dragging{z-index:4}
.sw.dragging .swbody{background:var(--surface-2);box-shadow:0 10px 26px rgba(0,0,0,.55);transition:none}
.dlist.dragon{cursor:grabbing;overflow:visible}

/* ---------- 0.1.4: rozbalenie cviku na jednotlivé série ---------- */
.setgrid2{display:grid;grid-template-columns:22px 1fr 1fr;gap:6px;align-items:center;margin-top:10px}
.setgrid2 .hd{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;text-align:center}
.setgrid2 .n{color:var(--muted);font-size:14px;font-weight:600;text-align:center}
.expand svg{transition:transform .15s ease-out}
.expand.on svg{transform:rotate(180deg)}
.bestfld{display:grid;grid-template-columns:1fr 14px 1fr;gap:6px;align-items:center}
.bestx{color:var(--muted);font-size:15px;font-weight:600;text-align:center}

/* ---------- 0.1.4: kolízia termínov v kalendári ---------- */
.conf{background:var(--surface);border-radius:var(--r);padding:13px var(--pad);
  border:1px solid rgba(255,176,32,.35);margin-bottom:10px}
.conf .ct{color:var(--warn);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.conf .ct svg{width:18px;height:18px}
.conf .cl{font-size:14px;margin-top:9px;display:flex;gap:8px;align-items:baseline}
.conf .cl b{font-variant-numeric:tabular-nums;font-weight:700;flex:none}
.conf .cbtns{display:flex;gap:8px;margin-top:13px}
.conf .cbtn{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
.conf .cbtn:active{background:var(--line)}
.conf .cbtn.danger{color:var(--warn);border-color:rgba(255,176,32,.3)}

/* ---------- 0.1.4: štvorcové tlačidlo + (kalendár) ----------
   Výraznejšie než holá ikona: biely štvorec so žiarou ako primárne tlačidlo. */
.addsq{width:46px;height:46px;flex:none;border-radius:13px;background:var(--accent);color:#0A0A0B;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--glow)}
.addsq:active{box-shadow:0 0 6px rgba(255,255,255,.25);opacity:.92}
.addsq svg{width:24px;height:24px}
.fabsq{position:absolute;right:var(--pad);bottom:calc(var(--tabh) + var(--sab) + 14px);z-index:5;
  width:56px;height:56px;border-radius:16px}
.fabsq svg{width:28px;height:28px}

/* ---------- 0.1.4: váha bez krokovania, len pole a „kg“ ---------- */
.kgfld{display:flex;align-items:center;gap:7px;background:var(--surface-2);border-radius:10px;padding:0 12px;min-width:0}
.kgfld input{flex:1;min-width:0;width:100%;background:transparent;border:0;text-align:center;
  font-size:17px;font-weight:600;padding:0;height:46px;-webkit-appearance:none;appearance:none}
.kgfld input:focus{outline:none}
.kgfld .u{color:var(--muted);font-size:13px;font-weight:600;flex:none}

/* ---------- 0.1.4: malé tlačidlá s väčším dosahom (+R, + v supersérii) ---------- */
.minibtn{position:relative;min-width:34px;height:28px;flex:none;border:1px solid var(--line);border-radius:8px;
  background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center}
.minibtn svg{width:15px;height:15px}
.minibtn:active{background:var(--line);color:var(--text)}
/* neviditeľné rozšírenie dotykovej plochy na 44 px */
.minibtn::after{content:'';position:absolute;left:-6px;right:-6px;top:-8px;bottom:-8px}

/* ---------- 0.1.4: rozcvičovacie série v úprave cviku ---------- */
.warmrow{display:grid;grid-template-columns:22px 1fr 1fr 40px;gap:6px;align-items:center;margin-bottom:8px}
.warmrow .n{color:var(--muted);font-size:14px;font-weight:600;text-align:center}
.warmrow .del{height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.warmrow .del:active{color:var(--warn)}
.warmhd{display:grid;grid-template-columns:22px 1fr 1fr 40px;gap:6px;margin-bottom:4px}
.warmhd div{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.warmrow .inp{min-height:46px;padding:12px 10px;text-align:center;font-weight:600}
/* blok rozcvičenia v zápise — odsadený, aby bolo vidieť, že nejde o pracovné série */
.warmblk{margin-top:10px;padding:10px 10px 2px;border-radius:10px;
  background:rgba(255,255,255,.03);border:1px dashed var(--line)}
.warmlbl{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:8px}
/* 0.1.5 — rozbaľovacia hlavička bloku rozcvičenia */
.warmtog{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;text-align:left}
.warmtog .warmlbl{flex:1;margin:0}
.warmtog .chev{color:var(--muted);display:flex;flex:none}
.warmblk .warmhd{margin-top:8px}

/* ---------- 0.1.5: výber položky v rozcvičke ---------- */
.pick{width:26px;height:26px;border-radius:13px;border:1.5px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;color:var(--muted)}
.pick.on{background:var(--accent);color:#0A0A0B;border-color:var(--accent);box-shadow:var(--glow)}
.pick svg{width:18px;height:18px}

/* ---------- 0.1.4: databáza cvikov — kategória raz, pod ňou podskupiny ---------- */
.dbcat{font-size:20px;font-weight:700;letter-spacing:-.02em;padding:0 var(--pad);margin:24px 0 0}
.dbsub{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:0 var(--pad);margin:14px 0 8px}

/* ---------- vysvetlivka sekcie (len prázdna verzia) ---------- */
#hint{position:absolute;left:0;right:0;bottom:0;z-index:70;pointer-events:none}
.hn-card{pointer-events:auto;margin:0 12px calc(12px + var(--sab));background:var(--surface);
  border:1px solid var(--line);border-radius:18px;padding:0 16px 16px;
  box-shadow:0 -12px 40px rgba(0,0,0,.55);
  animation:hnUp .3s cubic-bezier(.22,.9,.3,1)}
@keyframes hnUp{from{transform:translateY(112%)}to{transform:translateY(0)}}
#hint.out .hn-card{animation:hnDown .24s ease-in forwards}
@keyframes hnDown{from{transform:translateY(0)}to{transform:translateY(112%)}}
.hn-grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 12px}
.hn-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.hn-ico{width:42px;height:42px;flex:none;border-radius:14px;border:1px solid var(--line);
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text)}
.hn-ico svg{width:22px;height:22px}
.hn-t{font-weight:700;font-size:17px}
.hn-d{color:var(--muted);font-size:14px;line-height:1.5;margin-top:3px}


/* ---------- 0.1.3: akcie termínu v mesačnom kalendári ---------- */
.evtwrap{position:relative}
.evtwrap+.evtwrap .evt::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--line)}
.evtacts{display:flex;gap:8px;padding:0 0 10px 44px}
.evtact{display:flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:13px;font-weight:600}
.evtact svg{width:15px;height:15px}
.evtact:active{background:var(--line);color:var(--text)}
.evtact.danger{color:var(--warn);border-color:rgba(255,176,32,.3)}

/* ---------- 0.1.3: voľné termíny v pohľade klienta ---------- */
.cvdays{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.cvday{flex:none;width:54px;min-height:66px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cvday.on{border-color:var(--text);background:var(--surface-2)}
.cvdow{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cvnum{font-size:17px;font-weight:700}
.cvfree{font-size:10px;color:var(--muted)}
.cvday.on .cvfree,.cvday.on .cvdow{color:var(--text)}
.cvslots{display:flex;flex-wrap:wrap;gap:8px}
.cvslot{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);font-size:15px;font-weight:600}
.cvslot:active{background:var(--accent);color:#0A0A0B}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>
</head>

/* ---------- dates ---------- */
const MON = ['jan','feb','mar','apr','máj','jún','júl','aug','sep','okt','nov','dec'];

function ageDays(s) { return diffDays(parseD(s), today()); }
function fmtD(s) { const d = parseD(s); return d.getDate() + '. ' + MON[d.getMonth()]; }
function fmtDY(s) { const d = parseD(s); return d.getDate() + '. ' + MON[d.getMonth() + 0] + ' ' + d.getFullYear(); }
function fmtDW(s) { const d = parseD(s); return DOWL[d.getDay()] + ' ' + d.getDate() + '. ' + MON[d.getMonth()]; }

  const p = String(name).trim().split(/\s+/);

   a k nemu jeden najlepší výkon (opakovania × váha). */
function bestSet(rows) {
  if (!rows || !rows.length) return null;
  let b = rows[0];
  rows.forEach(r => {
    const rw = Number(r.w) || 0, bw = Number(b.w) || 0;
    if (rw > bw || (rw === bw && (Number(r.r) || 0) > (Number(b.r) || 0))) b = r;

  return { r: Number(b.r) || 0, w: Number(b.w) || 0 };

/* ---------- graf ---------- */
function chartSVG(pts, unit, opts) {
  opts = opts || {};
  const W = 320, H = 132, L = 34, R = 8, T = 10, B = 20;
  if (!pts.length) return '<div class="hint" style="padding:26px 10px;text-align:center">Žiadne dáta pre túto metriku.</div>';
  const vals = pts.map(p => p.v);
  let mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (mx - mn < 0.001) { mn -= 1; mx += 1; }
  const pad = (mx - mn) * 0.18; mn -= pad; mx += pad;
  const n = pts.length;
  const X = i => L + (n === 1 ? (W - L - R) / 2 : (W - L - R) * i / (n - 1));
  const Y = v => T + (H - T - B) * (1 - (v - mn) / (mx - mn));
  let d = '';
  pts.forEach((p, i) => { d += (i ? ' L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1); });
  let g = '';
  for (let i = 0; i <= 2; i++) {
    const y = T + (H - T - B) * i / 2;
    g += '<line class="gr" x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W - R) + '" y2="' + y.toFixed(1) + '"/>';
    const v = mx - (mx - mn) * i / 2;
    g += '<text class="ax" x="' + (L - 6) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + nf(Math.round(v * 10) / 10, (mx - mn) < 12 ? 1 : 0) + '</text>';
  }
  /* 0.1.4 — každý zápis je vlastný bod; po prejdení (alebo ťuknutí) ukáže bublinu */
  const fmtX = opts.fmt || fmtD;
  let dots = '';
  pts.forEach((p, i) => {
    const x = X(i), y = Y(p.v);
    const lbl = p.lbl || (fmtX(p.d) + ' · ' + nf(p.v, Math.abs(p.v % 1) > 0.001 ? 1 : 0) + (unit ? ' ' + unit : ''));
    const tw = Math.min(W - 4, Math.max(54, lbl.length * 5.2 + 16));
    let tx = x - tw / 2;
    if (tx < 2) tx = 2;
    if (tx + tw > W - 2) tx = W - 2 - tw;
    const ty = (y - 27 < 1) ? y + 9 : y - 27;
    dots += '<g class="dtg" tabindex="0">' +
      '<circle class="hit" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="9"/>' +
      '<circle class="dt" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.8"/>' +
      '<g class="tip"><rect x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" width="' + tw.toFixed(1) + '" height="18" rx="6"/>' +
      '<text x="' + (tx + tw / 2).toFixed(1) + '" y="' + (ty + 12.4).toFixed(1) + '" text-anchor="middle">' + esc(lbl) + '</text>' +
      '</g></g>';
  });
  const xa = '<text class="ax" x="' + L + '" y="' + (H - 4) + '">' + esc(fmtX(pts[0].d)) + '</text>' +
    (n > 1 ? '<text class="ax" x="' + (W - R) + '" y="' + (H - 4) + '" text-anchor="end">' + esc(fmtX(pts[n - 1].d)) + '</text>' : '');
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Graf vývoja">' +
    g + '<path class="ln" d="' + d + '"/>' + xa + dots + '</svg></div>';
}
/* ============================================================
   1. Klienti
   ============================================================ */
/* hlavička záložky Klienti — vpravo vstup do databázy cvikov */
function klientiHdrTop() {
  return '<div style="display:flex;align-items:center;gap:4px">' +
    '<h1 style="flex:1">Klienti</h1>' +
    // 0.1.5 — rozcvička stojí vedľa zásobníka cvikov
    '<button class="iconbtn muted" data-act="warmup" aria-label="Rozcvička">' + I.flame + '</button>' +
    '<button class="iconbtn muted" data-act="exDb" aria-label="Databáza cvikov">' + I.plan + '</button>' +
    '</div>';
}
/* 0.1.3 — v riadku je zostatok predplatených tréningov.
   „pred X dňami“ sa ukáže len vtedy, keď klient nemá potvrdený ďalší termín.
   0.1.4 — pri označenej nedostupnosti sa „Bez tréningu“ nezobrazuje. */
function clientRow(c) {
  const ls = lastSession(c.id);
  const nx = nextAppt(c.id);
  let sub = '';
  if (isPrepaid(c)) sub = 'Zostáva ' + leftLabel(c) + ' tréningov';
  if (c.holiday) {
    const ul = unavailLabel(c);
    sub = sub ? sub + ' · ' + ul.charAt(0).toLowerCase() + ul.slice(1) : ul;
  }
  const showRt = !nx && (ls || !c.holiday);
  return '<div class="row tap" role="button" tabindex="0" data-act="client" data-id="' + c.id + '" data-press="' + c.id + '">' +
    avatar(c.name) +
    '<div class="grow"><div class="nm">' + esc(c.name) + '</div>' +
    (sub ? '<div class="mt' + (c.holiday ? ' muted' : '') + '">' + esc(sub) + '</div>' : '') + '</div>' +
    (showRt ? '<div class="rt">' + (ls ? esc(rel(ls.date)) : 'Bez tréningu') + '</div>' : '') +
    (c.flag && !unavailNow(c) ? '<div class="dot"></div>' : '') +
    '<button class="iconbtn muted" data-act="clientMenu" data-id="' + c.id + '" aria-label="Možnosti">' + I.dots + '</button>' +
    '</div>';
}
function clientListHTML() {
  const q = ui.search.trim().toLowerCase();
  let list = S.clients.slice().sort((a, b) => a.name.localeCompare(b.name, 'sk'));
  if (q) list = list.filter(c => c.name.toLowerCase().indexOf(q) >= 0 || (planName(c.planId) || '').toLowerCase().indexOf(q) >= 0);
  if (!list.length) return '<div class="pad"><div class="hint" style="padding:24px 0;text-align:center">Nič sa nenašlo.</div></div>';
  return '<div class="pad"><div class="list">' + list.map(clientRow).join('') + '</div></div>';
}
function scKlienti() {
  const n = S.clients.length;
  if (!n && !ui.search) {
    return '<div class="hdr plain">' + klientiHdrTop() + '</div>' +
      '<div class="body pb-tab" data-scroll="klienti">' +

    '<div class="searchwrap">' + I.search +
    '<input class="inp" type="search" inputmode="search" placeholder="Hľadať klienta alebo plán" ' +
    'data-in="clientSearch" value="' + esc(ui.search) + '" autocomplete="off" autocorrect="off" spellcheck="false"></div>' +
    '</div><div class="body pb-tab" data-scroll="klienti">';
  if (flagged.length && !ui.search) {
    h += '<div class="sec" style="margin-top:18px">' + secH('Potrebujú pozornosť') +
      '<div class="pad"><div class="attn">' + flagged.map(c =>
        '<button class="row" data-act="client" data-id="' + c.id + '">' + avatar(c.name) +
        '<div class="grow"><div class="nm">' + esc(c.name) + '</div><div class="rsn">' + esc(c.flag) + '</div></div>' +
        '<div class="chev">' + I.chev + '</div></button>').join('') +
      '</div></div></div>';
  }
  h += '<div class="sec">' + secH(ui.search ? 'Výsledky' : 'Všetci klienti') +
    '<div id="clientList">' + clientListHTML() + '</div></div>';

/* ============================================================
   2. Detail klienta
   ============================================================ */
/* 0.1.4 — Váha je vlastná záložka, a to len u klienta, pre ktorého je
   relevantná váha a miery. */
function ctabsFor(c) {
  const t = [{ id: 'plan', t: 'Plán' }, { id: 'pokrok', t: 'Pokrok' }];
  if (c && c.strava) t.push({ id: 'vaha', t: 'Váha' });
  t.push({ id: 'info', t: 'Info' });
  return t;
}
function payLine(c) {
  if (c.platba !== 'predplatne') return 'Jednorazovo';
  return 'Predplatné · balík ' + esc(nf(c.prepaid)) + ' tréningov';
}
/* ---------- predplatené tréningy (0.1.3) ----------
   `left` je uložený zostatok balíka; pri uložení tréningu sa odpočíta. */
function isPrepaid(c) { return !!c && c.platba === 'predplatne' && c.prepaid > 0; }
function leftOf(c) { return isPrepaid(c) ? Math.max(0, Number(c.left) || 0) : 0; }
function leftLabel(c) { return nf(leftOf(c)) + ' z ' + nf(c.prepaid); }

/* ---------- najbližší termín ---------- */
function nextAppt(cid) {
  const t0 = ymd(today());
  return S.sessions
    .filter(s => s.clientId === cid && s.status === 'planned' && s.date >= t0)
    .sort((a, b) => a.date < b.date ? -1 : 1)[0] || null;
}
/* názov dňa z plánu pre termín — do kalendára */
function apptDayName(s) {
  if (s.dayId) {
    const p = plan(s.planId);
    const d = p && p.days.find(x => x.id === s.dayId);
    if (d) return d.name;
  }
  return s.dayName || 'Termín';
}

/* ---------- voľné termíny pre pohľad klienta ----------
   Pracovné hodiny trénera mínus obsadené hodiny a mínus pracovné voľno. */
function workHours() {
  const a = Math.max(0, Math.min(23, Number(S.coach.workFrom) || 6));
  const b = Math.max(a + 1, Math.min(24, Number(S.coach.workTo) || 20));
  // 0.1.4 — hodiny v pauze sa klientovi neponúkajú
  const bf = S.coach.breakFrom, bt = S.coach.breakTo;
  const hasBreak = bf != null && bt != null && bt > bf;
  const out = [];
  for (let h = a; h < b; h++) {
    if (hasBreak && h >= bf && h < bt) continue;
    out.push((h < 10 ? '0' : '') + h + ':00');
  }
  return out;
}
function breakLabel() {
  const bf = S.coach.breakFrom, bt = S.coach.breakTo;
  if (bf == null || bt == null || bt <= bf) return '';
  return nf(bf) + ':00 – ' + nf(bt) + ':00';
}
function freeSlots(dateStr) {
  if (offOn(dateStr)) return [];
  const taken = {};
  sessionsOn(dateStr).forEach(s => { taken[String(s.time || '').slice(0, 2)] = 1; });
  return workHours().filter(t => !taken[t.slice(0, 2)]);
}
function scClient(id) {
  const c = client(id);
  if (!c) return navbar('Klient') + '<div class="body"><div class="empty"><h2>Klient neexistuje</h2></div></div>';
  const ss = doneSessions(c.id);
  const tabs = ctabsFor(c);
  if (!tabs.some(x => x.id === ui.ctab)) ui.ctab = 'plan';
  // 0.1.4 — zápis tréningu je len v záložke Plán
  const showAct = ui.ctab === 'plan';
  const smsText = encodeURIComponent('Ahoj ' + c.name.split(' ')[0] + ', ako sa cítiš po poslednom tréningu?');
  let h = navbar(c.name, { right: '<button class="iconbtn muted" data-act="clientMenu" data-id="' + c.id + '" aria-label="Možnosti">' + I.dots + '</button>' });
  h += '<div class="body ' + (showAct ? 'pb-act' : 'pb-safe') + '" data-scroll="client-' + c.id + '">';

  // hlavička
  h += '<div class="pad" style="display:flex;gap:14px;align-items:center;padding-top:14px">' +
    avatar(c.name, 'lg') +
    '<div style="min-width:0"><div style="font-size:22px;font-weight:700;letter-spacing:-.02em">' + esc(c.name) + '</div>' +
    (isPrepaid(c)
      ? '<div class="hint">Zostáva <b style="color:var(--text)">' + esc(leftLabel(c)) + '</b> predplatených tréningov</div>'
      : '') +
    (c.holiday ? '<div class="hint muted">' + esc(unavailLabel(c)) + '</div>' : '') +
    '</div></div>';

  if (c.flag) h += '<div class="pad" style="margin-top:12px"><div class="card" style="border:1px solid rgba(255,176,32,.25)">' +
    '<div class="warn" style="font-weight:600">' + esc(c.flag) + '</div>' +
    '<div class="hint" style="margin-top:2px">Označené automaticky — ozvi sa klientovi.</div></div></div>';

  // 0.1.4 — správa a hovor priamo v profile (ako v 0.1.1), namiesto zrušenej záložky Správy
  if (c.phone) {
    h += '<div class="pad" style="display:flex;gap:8px;margin-top:14px">' +
      '<a class="btn quiet sm" style="flex:1;text-decoration:none" href="sms:' + esc(c.phone.replace(/\s/g, '')) + '&body=' + smsText + '">' + I.msg + 'Správa</a>' +
      '<a class="btn quiet sm" style="flex:1;text-decoration:none" href="tel:' + esc(c.phone.replace(/\s/g, '')) + '">' + I.phone + 'Zavolať</a>' +
      '</div>';
  }

  // záložky v profile klienta
  h += '<div class="pad" style="margin-top:18px"><div class="seg">' +
    tabs.map(x => '<button data-act="ctab" data-id="' + x.id + '" class="' + (ui.ctab === x.id ? 'on' : '') + '">' +
      esc(x.t) + '</button>').join('') + '</div></div>';

  if (ui.ctab === 'plan') h += ctabPlan(c);
  else if (ui.ctab === 'info') h += ctabInfo(c);
  else if (ui.ctab === 'vaha') h += ctabVaha(c);
  else h += ctabPokrok(c, ss);

  h += '<div style="height:20px"></div></div>';
  /* 0.1.4 fix — zápis z profilu ide cez rovnaký náhľad ako z kalendára */
  if (showAct) h += '<div class="actionbar"><button class="btn primary" data-act="prepLog" data-id="' + c.id + '">' + I.bolt + 'Zapísať tréning</button></div>';
  return h;
}

/* trvanie plánu ako text */
function planRange(p) {
  if (!p || !p.from) return '';
  return fmtD(p.from) + (p.to && p.to !== p.from ? ' – ' + fmtD(p.to) : '');
}
/* ---------- záložka Plán ---------- */
function ctabPlan(c) {
  const list = clientPlans(c.id);
  let h = '';
  if (!list.length) {
    h += '<div class="sec"><div class="pad"><div class="card" style="text-align:center;padding:26px 16px">' +
      '<div style="font-weight:700;font-size:18px">Žiadny plán</div>' +
      '<div class="hint" style="margin-top:6px;margin-bottom:16px">Plán je zoznam tréningových dní s cvikmi. Pri zápise tréningu sa predvyplní.</div>' +
      '<button class="btn primary" data-act="newPlan" data-id="' + c.id + '">' + I.plus + 'Pridať plán</button>' +
      '</div></div></div>';
    return h;
  }
  h += '<div class="sec">' + secH('Plány klienta') + '<div class="pad"><div class="list">' +
    list.map(p => {
      const act = p.id === c.planId;
      // 0.1.4 — text „×  týždenne“ je z pohľadu plánov preč
      const meta = [];
      if (planRange(p)) meta.push(planRange(p));
      if (!act) meta.push('neaktívny');
      return '<button class="row" data-act="plan" data-id="' + p.id + '"><div class="grow">' +
        '<div class="nm">' + esc(p.name) + '</div>' +
        (meta.length ? '<div class="mt">' + esc(meta.join(' · ')) + '</div>' : '') + '</div>' +
        (act ? '<div class="rt" style="color:var(--text)">Aktívny</div>' : '') +
        '<div class="chev">' + I.chev + '</div></button>';
    }).join('') +
    '<button class="row" data-act="newPlan" data-id="' + c.id + '">' +
    '<div class="chev" style="color:var(--text)">' + I.plus + '</div>' +
    '<div class="grow"><div class="nm" style="font-weight:600">Pridať plán</div></div></button>' +
    '</div></div></div>';
  return h;
}

/* ---------- záložka Info ---------- */
function infoRow(k, v) {
  return '<div class="row"><div class="grow"><div class="mt" style="margin:0">' + esc(k) + '</div></div>' +
    '<div class="rt" style="color:var(--text)">' + esc(v) + '</div></div>';
}
function fmtSize(b) {
  b = Number(b) || 0;
  if (b < 1024) return nf(b) + ' B';
  if (b < 1048576) return nf(b / 1024, 0) + ' kB';
  return nf(b / 1048576, 1) + ' MB';
}
function ctabInfo(c) {
  // 0.1.3 — údaje o klientovi presunuté z hlavičky profilu sem
  let h = '<div class="sec">' + secH('O klientovi') + '<div class="pad"><div class="list">' +
    infoRow('Typ', typeLabel(c)) +
    (c.age ? infoRow('Vek', nf(c.age) + ' r.') : '') +
    infoRow('Váha a miery', c.strava ? 'Áno' : 'Nie') +
    infoRow('Platba', payLine(c)) +
    (isPrepaid(c) ? infoRow('Zostáva', leftLabel(c) + ' tréningov') : '') +
    (c.typ === 'fixny' && c.dni.length
      ? infoRow('Termíny', c.dni.slice().sort((a, b) => a - b).map(i => DOWSHORT[i]).join(', ') + ' · ' + c.time)
      : '') +
    (c.phone ? infoRow('Telefón', c.phone) : '') +
    infoRow('Klient od', fmtDY(c.since)) +
    '</div></div></div>';

  h += '<div class="sec">' + secH('Dostupnosť') + '<div class="pad"><div class="list">' +
    '<button class="row" data-act="unavail" data-id="' + c.id + '"><div class="grow">' +
    '<div class="nm">' + (c.holiday ? 'Upraviť nedostupnosť' : 'Označiť nedostupnosť') + '</div>' +
    '<div class="mt">' + (c.holiday
      ? esc(unavailLabel(c)) + ' — nezobrazuje sa v sekcii Potrebujú pozornosť.'
      : 'Od–do alebo neurčito. Klient zmizne zo sekcie Potrebujú pozornosť.') + '</div></div>' +
    '<div class="chev">' + I.chev + '</div></button>' +
    (c.holiday
      ? '<button class="row" data-act="endUnavail" data-id="' + c.id + '"><div class="grow">' +
        '<div class="nm">Zrušiť nedostupnosť</div></div>' +
        '<div class="chev">' + I.chev + '</div></button>'
      : '') +
    (isPrepaid(c)
      ? '<button class="row" data-act="topUp" data-id="' + c.id + '"><div class="grow">' +
        '<div class="nm">Doplniť predplatené tréningy</div>' +
        '<div class="mt">Teraz zostáva ' + esc(leftLabel(c)) + '</div></div>' +
        '<div class="chev">' + I.chev + '</div></button>'
      : '') +
    '</div></div></div>';

  h += '<div class="sec"><div class="pad"><div class="list">' +
    '<button class="row" data-act="clientView" data-id="' + c.id + '">' +
    '<div class="chev" style="color:var(--text)">' + I.eye + '</div>' +
    '<div class="grow"><div class="nm">Zobraziť ako klient</div><div class="mt">Čo vidí klient vo svojej aplikácii</div></div>' +
    '<div class="chev">' + I.chev + '</div></button></div></div></div>';

  h += '<div class="sec">' + secH('Poznámka') + '<div class="pad">' +
    (c.note
      ? '<div class="card" style="font-size:15px;line-height:1.55">' + esc(c.note) + '</div>'
      : '<div class="card hint" style="text-align:center;padding:22px">Žiadna poznámka.</div>') +
    '</div></div>';

  const files = c.files || [];
  h += '<div class="sec">' + secH('Prílohy', files.length ? '<div class="hint">' + esc(nf(files.length)) + '</div>' : '') +
    '<div class="pad"><div class="list">' +
    files.map(f => '<div class="row">' +
      '<div class="grow"><div class="nm">' + esc(f.name) + '</div>' +
      '<div class="mt">' + esc(fmtSize(f.size)) + ' · ' + esc(fmtD(f.added)) + '</div></div>' +
      '<button class="iconbtn muted" data-act="delFile" data-id="' + c.id + '" data-fid="' + f.id + '" aria-label="Odstrániť prílohu">' + I.trash + '</button>' +
      '</div>').join('') +
    '<button class="row" data-act="pickFiles" data-id="' + c.id + '">' +
    '<div class="chev" style="color:var(--text)">' + I.plus + '</div>' +
    '<div class="grow"><div class="nm" style="font-weight:600">Pridať súbor</div>' +
    '<div class="mt">Merania, fotky, dohody — čokoľvek ku klientovi</div></div></button>' +
    '</div></div></div>';
  return h;
}

/* ---------- záložka Pokrok ----------
   Postup v aktívnom pláne: posuvník prechádza dni plánu, pre vybraný deň
   je jeden graf na každý cvik (jeho vývoj cez odtrénované jednotky).
   Váha tela má od 0.1.4 vlastnú záložku, tu už nie je. */
function ctabPokrok(c, ss) {
  let h = '';
  const p = plan(c.planId);

  if (!p || !p.days.length) {
    h += '<div class="sec"><div class="pad"><div class="card" style="text-align:center;padding:26px 16px">' +
      '<div style="font-weight:700;font-size:18px">Žiadny aktívny plán</div>' +
      '<div class="hint" style="margin-top:6px">Postup sa počíta z cvikov v aktívnom pláne. Pridaj plán v záložke Plán.</div>' +
      '</div></div></div>';
    return h;
  }
  if (!ss.length) {
    // 0.1.4 — zápis tréningu sa z Pokroku odstránil, tlačidlo je len v záložke Plán
    h += '<div class="sec"><div class="pad"><div class="card" style="text-align:center;padding:26px 16px">' +
      '<div style="font-weight:700;font-size:18px">Ešte žiadny tréning</div>' +
      '<div class="hint" style="margin-top:6px">Zapíš prvý tréning v záložke Plán a grafy postupu sa objavia tu.</div>' +
      '</div></div></div>';
    return h;
  }

  const di = Math.max(0, Math.min(p.days.length - 1, ui.planDay));
  const day = p.days[di];

  // posuvník dní plánu
  h += '<div class="sec" data-flash="chart">' + secH('Postup v pláne',
    '<div class="hint">' + esc(nf(di + 1)) + ' / ' + esc(nf(p.days.length)) + '</div>') +
    '<div class="pad">' +
    '<div style="display:flex;align-items:center;gap:8px">' +
    '<button class="iconbtn" data-act="planDay" data-id="-1" aria-label="Predošlý deň"' +
    (di === 0 ? ' disabled style="opacity:.3"' : '') + '>' + I.back + '</button>' +
    '<div style="flex:1;min-width:0;text-align:center;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
    esc(day.name) + '</div>' +
    '<button class="iconbtn" data-act="planDay" data-id="1" aria-label="Ďalší deň" style="transform:rotate(180deg)' +
    (di === p.days.length - 1 ? ';opacity:.3' : '') + '"' + (di === p.days.length - 1 ? ' disabled' : '') + '>' + I.back + '</button>' +
    '</div>';
  if (p.days.length > 1) {
    h += '<div style="display:flex;gap:5px;justify-content:center;margin-top:8px">' +
      p.days.map((d, i) => '<span style="width:' + (i === di ? '18px' : '6px') + ';height:6px;border-radius:3px;background:' +
        (i === di ? 'var(--text)' : 'var(--line)') + '"></span>').join('') + '</div>';
  }
  h += '</div></div>';

  // graf pre každý cvik v tomto dni
  if (!day.items.length) {
    h += '<div class="pad" style="margin-top:12px"><div class="card hint" style="text-align:center;padding:22px">' +
      'Tento deň nemá žiadne cviky.</div></div>';
  } else {
    h += '<div class="pad" style="margin-top:12px">';
    day.items.forEach(it => {
      const ex = exOf(it.exId);
      const pts = exSeries(c.id, it.exId);
      const u = exUnit(it.exId);
      const cur = pts.length ? pts[pts.length - 1].v : 0;
      const first = pts.length ? pts[0].v : 0;
      const chg = pts.length > 1 ? cur - first : 0;
      h += '<div class="card" style="margin-bottom:10px">' +
        '<div style="display:flex;align-items:baseline;gap:8px">' +
        '<div style="flex:1;min-width:0;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        esc(ex ? ex.name : 'Cvik') + '</div>' +
        (pts.length ? '<div style="font-weight:700;white-space:nowrap">' + esc(nf(cur, Math.abs(cur % 1) > 0.001 ? 1 : 0)) +
          ' <span class="hint">' + esc(u) + '</span></div>' : '') +
        '</div>' +
        (pts.length > 1
          ? '<div class="hint" style="margin-top:2px">' + (chg === 0 ? 'bez zmeny' : esc(signed(Math.round(chg * 10) / 10)) + ' ' + esc(u)) +
            ' za ' + esc(pTrening(pts.length)) + '</div>' +
            '<div class="chartcard" style="margin-top:8px;padding:8px 4px 0;background:transparent">' + chartSVG(exPts(pts), u) + '</div>'
          : '<div class="hint" style="margin-top:4px">' + (pts.length ? 'Zatiaľ jeden zápis — graf sa objaví po druhom.' : 'Tento cvik ešte nebol zapísaný.') + '</div>') +
        '</div>';
    });
    h += '</div>';
  }

  return h;
}
/* 0.1.4 — bublina bodu v grafe cviku: dátum, váha a opakovania */
function exPts(pts) {
  return pts.map(p => ({ d: p.d, v: p.v,
    lbl: fmtD(p.d) + ' · ' + (p.w ? kg(p.w) + ' × ' + nf(p.r) : nf(p.r) + ' opak.') }));
}
/* váha tela a miery — 0.1.4 vlastná záložka v profile klienta */
function ctabVaha(c) {
  let h = weightBlock(c);
  h += '<div class="sec">' + secH('Miery') + '<div class="pad">' +
    '<div class="field" style="margin:0"><label>Obvod pása</label>' +
    '<input class="inp" data-in="waist" data-id="' + c.id + '" inputmode="decimal" ' +
    'placeholder="napr. 84 cm" value="' + esc(c.waist || '') + '"></div>' +
    '<div class="hint" style="margin-top:8px">Zapíše sa hneď, ako píšeš.</div>' +
    '</div></div>';
  return h;
}
/* váha tela — len pre klientov, u ktorých je relevantná váha a miery */
function weightBlock(c) {
  if (!c.strava) return '';
  const pts = metricSeries(c.id, 'vaha').map(p => ({ d: p.d, v: p.v, lbl: fmtD(p.d) + ' · ' + kg(p.v, true) }));
  let h = '<div class="sec">' + secH('Váha') + '<div class="pad">';
  if (pts.length > 1) {
    const cur = pts[pts.length - 1].v;
    const cut = ymd(addDays(today(), -30));
    let ref = pts[0];
    for (let i = 0; i < pts.length; i++) { if (pts[i].d <= cut) ref = pts[i]; }
    const chg = cur - ref.v;
    h += '<div class="chartcard">' + chartSVG(pts, 'kg') + '</div>' +
      '<div class="tiles" style="margin-top:10px">' +
      tile(esc(nf(cur, 1)) + ' <span style="font-size:13px;color:var(--muted)">kg</span>', 'Teraz') +
      tile('<span class="' + (chg === 0 ? 'muted' : '') + '">' + esc(signed(Math.round(chg * 10) / 10)) + '</span>', '30 dní') +
      tile(esc(nf(pts.length)), 'Vážení') +
      '</div>';
  } else {
    h += '<div class="card hint" style="text-align:center;padding:22px">Zatiaľ žiadne váženia.</div>';
  }
  return h + '</div></div>';
}

/* ---------- náhľad tréningu ----------
   0.1.4 — rovnaký náhľad pre odtrénovaný aj naplánovaný termín. Pri naplánovanom
   sú cviky z dňa plánu, dajú sa jednorazovo vymeniť a je tu zápis tréningu. */
function scSession(id) {
  const s = sessById(id);
  if (!s) return navbar('Tréning') + '<div class="body"></div>';
  const c = client(s.clientId);
  const planned = s.status !== 'done';
  let h = navbar(apptDayName(s), s.id === PREP ? { backAct: 'closePrep' } : null) +
    '<div class="body ' + (planned ? 'pb-act' : 'pb-safe') + '" data-scroll="sess-' + id + '">';
  h += '<div class="pad" style="padding-top:14px"><div class="hint">' + esc(c ? c.name : '') + ' · ' + esc(fmtDW(s.date)) +
    (planned && s.time ? ' · ' + esc(s.time) : '') + '</div></div>';

  if (planned) {
    const items = plannedItems(s);
    const prep = s.id === PREP;
    h += '<div class="sec">' + secH(prep ? 'Cviky v tomto tréningu' : 'Cviky v tomto termíne') + '<div class="pad">';
    if (!items.length) {
      h += '<div class="card hint" style="text-align:center;padding:22px">' +
        (prep ? 'Klient nemá aktívny plán — cviky pridáš pri samotnom zápise.'
              : 'Termín zatiaľ nemá cviky — klient nemá aktívny plán alebo deň plánu.') + '</div>';
    } else {
      /* 0.1.4 fix — potiahnutím doľava sa odkryje jednorazová výmena a odstránenie,
         rovnako ako v pláne. Oboje platí len pre tento tréning. */
      items.forEach((it, ii) => {
        const ex = exOf(it.exId);
        const nw = warmOf(it).length;
        h += '<div class="sw excsw">' +
          '<div class="swacts">' +
          '<button class="swact" data-act="swapPlanned" data-id="' + s.id + '" data-idx="' + ii + '" aria-label="Vymeniť cvik">' + I.swap1 + '</button>' +
          '<button class="swact danger" data-act="delPlannedEx" data-id="' + s.id + '" data-idx="' + ii + '" aria-label="Odstrániť cvik">' + I.trash + '</button>' +
          '</div>' +
          '<div class="exc swbody" style="padding-bottom:14px">' +
          '<h3>' + esc(ex ? ex.name : 'Cvik') + '</h3>' +
          '<div class="last">' + esc(pSeria(it.sets) + ' · ' + repsText(it) + ' opak.' +
            (nw ? ' · ' + nf(nw) + ' rozcvič.' : '')) + '</div>' +
          '</div></div>';
      });
      h += '<div class="hint">Potiahnutím doľava cvik vymeníš alebo odstrániš — len pre tento tréning, ' +
        'aktívny plán sa nemení.</div>';
    }
    h += '</div></div>';
  } else {
    h += '<div class="sec">' + secH('Cviky') + '<div class="pad">';
    (s.exs || []).forEach(e => {
      const wt = warmText(e.warm);
      h += '<div class="exc"><h3>' + esc(e.name) + '</h3>' +
        '<div style="margin-top:8px;padding-bottom:8px">' +
        (wt ? '<div class="hint" style="margin-bottom:6px">Rozcvičenie: ' + esc(wt) + '</div>' : '') +
        '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">' +
        '<b style="font-size:19px">' + esc(pSeria(e.sets)) + '</b>' +
        '<span class="muted" style="font-size:16px">najlepší výkon ' + esc(perfText(e.reps, e.w)) + '</span></div>' +
        (e.note ? '<div class="hint" style="margin-top:6px">' + esc(e.note) + '</div>' : '') +
        '</div></div>';
    });
    h += '</div></div>';
  }

  if (s.note) h += '<div class="sec">' + secH('Poznámka k tréningu') + '<div class="pad"><div class="card" style="font-size:15px">' + esc(s.note) + '</div></div></div>';
  h += '<div style="height:24px"></div></div>';
  if (planned) h += '<div class="actionbar"><button class="btn primary" data-act="logStart" data-id="' + s.clientId +
    '" data-sid="' + s.id + '">' + I.bolt + 'Zapísať tréning</button></div>';
  return h;
}
/* ============================================================
   5. Kalendár
   ============================================================ */
function sessionsOn(dateStr) {
  return S.sessions.filter(s => s.date === dateStr)
    .sort((a, b) => String(a.time || '').localeCompare(String(b.time || '')));
}
/* Riadok v kalendári: pod menom je tréningový deň z plánu (napr. Deň A — Drep).
   V mesačnom zobrazení má naplánovaný termín aj presun a zrušenie.
   0.1.4 fix — v mesačnom zobrazení (`hideDay`) zostáva pod menom iba zostatok
   predplatených tréningov, názov dňa z plánu tam nie je. */
function evtHTML(s, opts) {
  const c = client(s.clientId);
  if (!c) return '';
  const cls = s.status === 'done' ? 'done' : s.status;
  const acts = opts && opts.actions && s.status === 'planned';
  const hideDay = !!(opts && opts.hideDay);
  const sub = (hideDay ? '' : apptDayName(s)) +
    (isPrepaid(c) ? (hideDay ? '' : ' · ') + nf(leftOf(c)) + ' / ' + nf(c.prepaid) : '');
  return '<div class="evtwrap">' +
    '<div class="evt ' + cls + ' tap" role="button" tabindex="0" data-act="evt" data-id="' + s.id + '">' +
    '<div class="tm">' + esc(s.time || '') + '</div>' + avatar(c.name, 'sm') +
    '<div class="grow" style="min-width:0"><div class="nm2">' + esc(c.name) + '</div>' +
    (sub ? '<div class="sb">' + esc(sub) + '</div>' : '') + '</div>' +
    '<div class="chev">' + I.chev + '</div></div>' +
    (acts
      ? '<div class="evtacts">' +
        '<button class="evtact" data-act="postponeAppt" data-id="' + s.id + '">' + I.cal + 'Presunúť termín</button>' +
        '<button class="evtact danger" data-act="cancelAppt" data-id="' + s.id + '">' + I.x + 'Zrušiť termín</button>' +
        '</div>'
      : '') +
    '</div>';
}
/* 0.1.4 — dva termíny v rovnaký deň a čas sa v kalendári označia oranžovou
   výstrahou s tromi možnosťami: zapísať oba, nahradiť pôvodný, zrušiť nový. */
function conflictsHTML() {
  const list = liveConflicts();
  if (!list.length) return '';
  let h = '<div class="pad" style="margin-top:14px">';
  list.forEach(cf => {
    const a = S.sessions.find(x => x.id === cf.newId);
    const b = S.sessions.find(x => x.id === cf.oldId);
    const ca = client(a.clientId), cb = client(b.clientId);
    h += '<div class="conf">' +
      '<div class="ct">' + I.alert + 'Kolízia termínov</div>' +
      '<div class="hint" style="margin-top:5px">' + esc(fmtDW(a.date)) + ' · ' + esc(hhmm(a.time)) + '</div>' +
      '<div class="cl"><b>' + esc(hhmm(b.time)) + '</b><span>' + esc((cb ? cb.name : '') + ' · ' + apptDayName(b)) +
      ' <span class="muted">pôvodný</span></span></div>' +
      '<div class="cl"><b>' + esc(hhmm(a.time)) + '</b><span>' + esc((ca ? ca.name : '') + ' · ' + apptDayName(a)) +
      ' <span class="muted">nový</span></span></div>' +
      '<div class="cbtns">' +
      '<button class="cbtn" data-act="cfKeep" data-id="' + cf.id + '">Zapísať</button>' +
      '<button class="cbtn" data-act="cfReplace" data-id="' + cf.id + '">Nahradiť</button>' +
      '<button class="cbtn danger" data-act="cfCancel" data-id="' + cf.id + '">Zrušiť</button>' +
      '</div></div>';
  });
  return h + '</div>';
}
function scKalendar() {
  const t0 = today();
  let h = '<div class="hdr plain">' +
    '<div style="display:flex;align-items:center;gap:8px">' +
    '<h1 style="flex:1">Kalendár</h1>' +
    (ui.calView === 'month'
      ? '<button class="iconbtn muted" data-act="calMenu" aria-label="Možnosti kalendára">' + I.dots + '</button>'
      : '') +
    '</div>' +
    '<div class="seg" style="margin-top:12px">' +
    '<button data-act="calView" data-id="week" class="' + (ui.calView === 'week' ? 'on' : '') + '">Týždeň</button>' +
    '<button data-act="calView" data-id="month" class="' + (ui.calView === 'month' ? 'on' : '') + '">Mesiac</button>' +
    '</div></div><div class="body pb-tab" data-scroll="kal">';

  h += conflictsHTML();

  if (ui.calView === 'week') {
    const ws = addDays(startOfWeek(t0), ui.weekOff * 7);
    const days = []; for (let i = 0; i < 7; i++) days.push(addDays(ws, i));
    const all = days.map(d => sessionsOn(ymd(d)));
    const flat = all.reduce((a, b) => a.concat(b), []);
    h += '<div style="display:flex;align-items:center;gap:4px;padding:14px ' + '10px' + ' 12px">' +
      '<button class="iconbtn" data-act="week" data-id="-1" aria-label="Predošlý týždeň">' + I.back + '</button>' +
      '<div style="flex:1;text-align:center;font-weight:700;font-size:16px">' +
      esc(ws.getDate() + '. ' + MON[ws.getMonth()] + ' – ' + addDays(ws, 6).getDate() + '. ' + MON[addDays(ws, 6).getMonth()]) + '</div>' +
      '<button class="iconbtn" data-act="week" data-id="1" aria-label="Ďalší týždeň" style="transform:rotate(180deg)">' + I.back + '</button></div>';
    const anyOff = days.some(d => offOn(ymd(d)));
    if (!flat.length && !anyOff) {
      h += '<div class="empty" style="padding-top:44px"><h2>Prázdny týždeň</h2>' +
        '<p>Termíny sa tu objavia, keď pridáš fixného klienta s dňami alebo operatívneho zapíšeš ručne.</p></div>';
    } else {
      h += '<div class="pad" style="margin-top:4px">';
      days.forEach((d, i) => {
        const ds = ymd(d), isT = ds === ymd(t0), o = offOn(ds);
        h += '<div class="daycard' + (isT ? ' today' : '') + (o ? ' offday' : '') + '"><div class="dayhd">' +
          '<div class="dn">' + esc(DOWL[d.getDay()]) + '</div>' +
          '<div class="dd">' + d.getDate() + '. ' + MON[d.getMonth()] + '</div>' +
          (isT ? '<div class="td">DNES</div>' : '') +
          '</div>' +
          (o ? '<div class="offtag">Voľno' + (o.note ? ' · ' + esc(o.note) : '') + '</div>' : '') +
          (all[i].length ? all[i].map(evtHTML).join('')
            : (o ? '' : '<div class="hint" style="padding:8px 0 12px">Bez termínu</div>')) +
          '</div>';
      });
      h += '</div>';
    }
  } else {
    const base = new Date(t0.getFullYear(), t0.getMonth() + ui.monthOff, 1);
    const first = startOfWeek(base);
    const cells = []; for (let i = 0; i < 42; i++) cells.push(addDays(first, i));
    h += '<div style="display:flex;align-items:center;gap:4px;padding:14px 10px 8px">' +
      '<button class="iconbtn" data-act="month" data-id="-1" aria-label="Predošlý mesiac">' + I.back + '</button>' +
      '<div style="flex:1;text-align:center;font-weight:700;font-size:16px">' + esc(MONL[base.getMonth()] + ' ' + base.getFullYear()) + '</div>' +
      '<button class="iconbtn" data-act="month" data-id="1" aria-label="Ďalší mesiac" style="transform:rotate(180deg)">' + I.back + '</button></div>';
    // súhrn za zobrazený mesiac
    const mTot = S.sessions.filter(s => {
      const d = parseD(s.date);
      return d.getFullYear() === base.getFullYear() && d.getMonth() === base.getMonth();
    });
    h += '<div class="strip" style="margin-bottom:14px;grid-template-columns:1fr">' +
      tile(esc(nf(mTot.length)), 'Tréningov v mesiaci') + '</div>';
    h += '<div class="mgrid">' + ['po','ut','st','št','pi','so','ne'].map(d => '<div class="wd">' + d + '</div>').join('') + '</div>';
    h += '<div class="mgrid">' + cells.map(d => {
      const ds = ymd(d), ss = sessionsOn(ds);
      const out = d.getMonth() !== base.getMonth();
      const o = offOn(ds);
      const pips = ss.slice(0, 3).map(s => '<div class="pip ' + (s.status === 'done' ? 'd' : (s.status === 'missed' ? 'm' : '')) + '"></div>').join('');
      return '<button class="mcell' + (out ? ' out' : '') + (ds === ymd(t0) ? ' today' : '') +
        (o ? ' off' : '') + (ui.calDay === ds ? ' on' : '') +
        '" data-act="calDay" data-id="' + ds + '"><span>' + d.getDate() + '</span><div class="pips">' + pips + '</div></button>';
    }).join('') + '</div>';
    const sel = ui.calDay || ymd(t0);
    const ss = sessionsOn(sel);
    const so = offOn(sel);
    // 0.1.4 fix — výraznejšie štvorcové +
    h += '<div class="sec">' + secH(fmtDW(sel),
      '<button class="addsq" data-act="addOpAppt" data-id="' + sel + '" aria-label="Pridať termín" ' +
      'style="margin:-8px 0 -8px 0">' + I.plus + '</button>') +
      '<div class="pad"><div class="daycard' + (so ? ' offday' : '') + '">' +
      (so ? '<div class="offtag">Voľno' + (so.note ? ' · ' + esc(so.note) : '') + '</div>' : '') +
      (ss.length ? ss.map(x => evtHTML(x, { actions: true, hideDay: true })).join('')
        : (so ? '' : '<div class="hint" style="padding:8px 0 12px">Žiadne termíny v tento deň.</div>')) +
      '</div></div></div>';
  }
  h += '<div style="height:20px"></div></div>';
  /* 0.1.4 fix — v týždni je jedno štvorcové + vpravo dole namiesto siedmich
     malých pri dňoch; predvolí dnešok, inak pondelok zobrazeného týždňa */
  if (ui.calView === 'week') {
    const ws2 = addDays(startOfWeek(t0), ui.weekOff * 7);
    const dflt = ui.weekOff === 0 ? ymd(t0) : ymd(ws2);
    h += '<button class="addsq fabsq" data-act="addOpAppt" data-id="' + dflt + '" aria-label="Pridať termín">' + I.plus + '</button>';
  }
  return h;
}

/* ============================================================
   4. Plán klienta (editor) — otvára sa z profilu klienta
   ============================================================ */
/* 0.1.4 — RPE a cieľová váha sa už nezadávajú; opakovania môžu byť rozsah.
   0.1.4 fix — za nimi je počet rozcvičovacích sérií, ak nejaké sú. */
function warmOf(it) { return (it && it.warm) || []; }
function itemLine(it) {
  const n = warmOf(it).length;
  return nf(it.sets) + ' × ' + repsText(it) +
    (n ? ' · ' + nf(n) + ' ' + plural(n, 'rozcvičovacia séria', 'rozcvičovacie série', 'rozcvičovacích sérií') : '');
}
function scPlan(id) {
  const p = plan(id);
  if (!p) return navbar('Plán') + '<div class="body"></div>';
  const owner = client(p.clientId);
  const isActive = owner && owner.planId === p.id;
  // 0.1.4 — namiesto „Upraviť“ sú tri bodky s možnosťami plánu
  let h = navbar(p.name, { right: '<button class="iconbtn muted" data-act="planMenu" data-id="' + p.id + '" aria-label="Možnosti plánu">' + I.dots + '</button>' });
  h += '<div class="body pb-safe" data-scroll="plan-' + p.id + '">';
  h += '<div class="pad" style="padding-top:14px"><div class="hint">' +
    (owner ? esc(owner.name) : '') + (isActive ? ' · aktívny plán' : '') + '</div></div>';
  h += '<div class="pad" style="margin-top:12px"><div class="strip" style="padding:0;grid-template-columns:1fr">' +
    tile(planRange(p) ? esc(planRange(p)) : '<span class="muted">neurčené</span>', 'Trvanie') + '</div></div>';

  /* riadok cviku: potiahnutím doľava sa odkryje výmena a odstránenie,
     úchytom vpravo sa cvik presúva medzi ostatnými */
  function itemRow(d, it, ii) {
    const ex = exOf(it.exId);
    return '<div class="sw" data-drow="' + ii + '">' +
      '<div class="swacts">' +
      '<button class="swact" data-act="replaceItem" data-pid="' + p.id + '" data-did="' + d.id + '" data-idx="' + ii + '" aria-label="Vymeniť cvik">' + I.swap + '</button>' +
      '<button class="swact danger" data-act="delItem" data-pid="' + p.id + '" data-did="' + d.id + '" data-idx="' + ii + '" aria-label="Odstrániť cvik">' + I.trash + '</button>' +
      '</div>' +
      '<div class="row tap swbody" role="button" tabindex="0" data-act="editItem" data-pid="' + p.id + '" data-did="' + d.id + '" data-idx="' + ii + '">' +
      // 0.1.5 — +R je už len v úprave cviku, riadok ostáva čistý
      '<div class="grow"><div class="nm">' + esc(ex ? ex.name : 'Cvik') + '</div>' +
      '<div class="mt">' + esc(itemLine(it)) + '</div></div>' +
      '<span class="iconbtn muted grip" data-act="noop" data-drag="' + ii + '" aria-label="Presunúť cvik">' + I.grip + '</span>' +
      '</div></div>';
  }

  p.days.forEach(d => {
    h += '<div class="sec">' + secH(d.name,
      '<button class="iconbtn ghost" data-act="dayMenu" data-pid="' + p.id + '" data-id="' + d.id + '">' + I.dots + '</button>') +
      '<div class="pad"><div class="list dlist" data-dlist="' + p.id + '|' + d.id + '">';
    if (!d.items.length) h += '<div class="row"><div class="grow hint">Žiadne cviky.</div></div>';
    // po sebe idúce cviky s rovnakou supersériou sa zabalia do jedného bloku
    let open = null;
    d.items.forEach((it, ii) => {
      if ((it.ss || null) !== open) {
        if (open) h += '</div>';
        open = it.ss || null;
        /* 0.1.4 fix — pridávanie do supersérie je malé + pri jej názve

          '<div class="swacts"><button class="swact danger" data-act="delSs" data-pid="' + p.id + '" data-did="' + d.id +

          'aria-label="Pridať cvik do supersérie">' + I.plus + '</button></div></div>';

    h += '<button class="row" data-act="newSs" data-pid="' + p.id + '" data-did="' + d.id + '">' +
      '<div class="chev" style="color:var(--text)">' + I.plus + '</div>' +

      '<div class="mt">Zoskup cviky a rovno do nej pridaj cviky</div></div></button>';
    h += '</div></div></div>';
  });

  if (!isActive) h += '<div class="sec"><div class="pad"><button class="btn quiet" data-act="setActive" data-id="' + p.id + '">' +

/* Nový klient — typ, váha a miery, platba, (predplatené tréningy), dni pre fixného.
   Rozbaľovacie časti prekresľujú sheet, preto sa rozpísaný text najprv odloží. */
function ovAddClient(o) {
  if (o.typ === undefined) o.typ = 'fixny';
  if (o.strava === undefined) o.strava = false;
  if (o.platba === undefined) o.platba = 'jednorazovo';
  if (o.prepaid === undefined) o.prepaid = 10;
  if (!o.dni) o.dni = [];
  if (!o.time) o.time = '17:00';

  let b = '<div class="field"><label>Meno a priezvisko</label>' +
    '<input class="inp" id="f-name" placeholder="napr. Jana Kollárová" value="' + esc(o.name || '') + '" autocomplete="off" autocapitalize="words"></div>' +
    '<div class="field"><label>Telefón</label>' +
    '<input class="inp" id="f-phone" type="tel" inputmode="tel" placeholder="0900 123 456" value="' + esc(o.phone || '') + '" autocomplete="off"></div>';

  // typ klienta
  b += '<div class="field"><label>Typ klienta</label><div class="seg">' +
    '<button data-act="acTyp" data-id="fixny" class="' + (o.typ === 'fixny' ? 'on' : '') + '">Fixný</button>' +
    '<button data-act="acTyp" data-id="operativny" class="' + (o.typ === 'operativny' ? 'on' : '') + '">Operatívny</button>' +
    '</div><div class="hint" style="margin-top:6px">' +
    (o.typ === 'fixny'
      ? 'Fixný klient má pevné dni v týždni — termíny sa zapíšu do kalendára.'
      : 'Operatívneho klienta zapíšeš do kalendára kedykoľvek, bez pevných dní.') +
    '</div></div>';

  // dni + čas iba pre fixného
  if (o.typ === 'fixny') {
    b += '<div class="field"><label>Dni v týždni</label><div class="chips">' +
      DOWSHORT.map((d, i) => '<button class="chip ' + (o.dni.indexOf(i) >= 0 ? 'on' : '') + '" data-act="acDay" data-id="' + i + '">' +
        esc(d) + '</button>').join('') + '</div></div>' +
      '<div class="field"><label>Čas termínu</label>' +
      '<input class="inp" type="time" id="f-time" value="' + esc(o.time) + '"></div>';
  }

  // váha a miery (do 0.1.3 „strava“)
  b += '<div class="field"><label>Váha a miery</label><div class="seg">' +
    '<button data-act="acStrava" data-id="1" class="' + (o.strava ? 'on' : '') + '">Áno</button>' +
    '<button data-act="acStrava" data-id="0" class="' + (!o.strava ? 'on' : '') + '">Nie</button>' +
    '</div><div class="hint" style="margin-top:6px">Pri „Áno“ pribudne v profile záložka Váha s grafom a obvodom pása.</div></div>';

  // platba
  b += '<div class="field"><label>Platba</label><div class="seg">' +
    '<button data-act="acPlatba" data-id="jednorazovo" class="' + (o.platba === 'jednorazovo' ? 'on' : '') + '">Jednorazovo</button>' +
    '<button data-act="acPlatba" data-id="predplatne" class="' + (o.platba === 'predplatne' ? 'on' : '') + '">Predplatné</button>' +
    '</div></div>';

  if (o.platba === 'predplatne') {
    b += '<div class="field"><label>Predplatené tréningy</label>' +
      '<div class="stp" style="max-width:190px">' +
      '<button data-act="acPre" data-id="-1">' + I.minus + '</button>' +
      '<input id="f-prepaid" inputmode="numeric" value="' + esc(nf(o.prepaid)) + '">' +
      '<button data-act="acPre" data-id="1">' + I.plus + '</button></div></div>';
  }

  b += '<div class="field"><label>Poznámka</label>' +
    '<textarea class="inp" id="f-note" placeholder="Zranenia, obmedzenia, kedy môže trénovať…">' + esc(o.note || '') + '</textarea></div>' +
    '<button class="btn primary" data-act="saveClient">Pridať klienta</button>';
  return sheet('Nový klient', b, { key: 'addClient' });
}

function ovSwapEx(o) {

  if (o.log) {
    const d = ui.draft; if (!d) return '';
    cid = d.clientId;
    curId = (d.exs[o.ei] || {}).exId;

    const s = sessById(o.id); if (!s) return '';
    cid = s.clientId;
    curId = (plannedItems(s)[o.idx] || {}).exId;
  }
  const groups = planExByDay(cid);
  const attrs = o.log
    ? ' data-log="1" data-ei="' + o.ei + '"'
    : ' data-id="' + o.id + '" data-idx="' + o.idx + '"';
  const b = '<div class="hint" style="margin-bottom:14px">Výmena platí len pre tento tréning — aktívny plán zostáva nezmenený.</div>' +
    (groups.length
      ? groups.map(g =>

          '<div class="grow"><div class="nm">' + esc(e.name) + '</div>' +
          '<div class="mt">' + esc(exGroup(e)) + '</div></div>' +

          '</button>').join('') + '</div>').join('')
      : '<div class="hint" style="text-align:center;padding:16px 0">Aktívny plán nemá žiadne cviky.</div>');
